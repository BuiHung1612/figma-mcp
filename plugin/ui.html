<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma MCP</title>
  <style>
    /* ── DESIGN TOKENS ── */
    :root {
      --bg:          #09090f;
      --surface-1:   #0f1117;
      --surface-2:   #141720;
      --surface-3:   #1a1f2e;
      --surface-4:   #222844;
      --border-1:    rgba(255,255,255,0.05);
      --border-2:    rgba(255,255,255,0.10);
      --border-3:    rgba(255,255,255,0.16);
      --text-1:      #f0f2f8;
      --text-2:      #8b95b0;
      --text-3:      #4e5873;
      --accent:      #6366f1;
      --accent-2:    #06b6d4;
      --green:       #22d3a0;
      --amber:       #f59e0b;
      --rose:        #f43f5e;
      --violet:      #a78bfa;
      --radius-sm:   6px;
      --radius-md:   10px;
      --radius-lg:   14px;
      --transition:  0.18s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', sans-serif;
      background: var(--bg);
      color: var(--text-1);
      font-size: 11px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      top: -80px; left: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -60px; right: -40px;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(6,182,212,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 10px;
      gap: 7px;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    .brand { display: flex; align-items: center; gap: 9px; }

    .brand-logo {
      width: 26px; height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 0 0 1px rgba(99,102,241,0.3), 0 4px 12px rgba(79,70,229,0.35);
    }
    .brand-logo svg { display: block; }
    .brand-info { display: flex; flex-direction: column; gap: 1px; }
    .brand-name { font-size: 11.5px; font-weight: 700; letter-spacing: 0.3px; color: var(--text-1); line-height: 1; }
    .brand-file { font-size: 9px; color: var(--text-3); font-weight: 500; letter-spacing: 0.2px; line-height: 1; }

    .status-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border-1);
      border-radius: 100px;
      padding: 4px 10px 4px 7px;
      font-size: 10px; font-weight: 600;
      color: var(--text-2); letter-spacing: 0.1px;
      transition: border-color var(--transition), background var(--transition);
    }
    .status-pill.connected { border-color: rgba(34,211,160,0.25); background: rgba(34,211,160,0.06); }
    .status-pill.offline   { border-color: rgba(244,63,94,0.2);   background: rgba(244,63,94,0.05);  }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%; flex-shrink: 0;
      transition: background var(--transition), box-shadow var(--transition);
    }
    .dot.green  { background: var(--green);  box-shadow: 0 0 0 2px rgba(34,211,160,0.2),  0 0 8px rgba(34,211,160,0.5);  }
    .dot.yellow { background: var(--amber);  box-shadow: 0 0 0 2px rgba(245,158,11,0.2),  0 0 8px rgba(245,158,11,0.4);  animation: blink 1.4s ease-in-out infinite; }
    .dot.red    { background: var(--rose);   box-shadow: 0 0 0 2px rgba(244,63,94,0.2),   0 0 8px rgba(244,63,94,0.4);   }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* STATS ROW */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 6px;
      flex-shrink: 0;
    }

    .stat-card {
      background: var(--surface-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-sm);
      padding: 7px 8px;
      display: flex; flex-direction: column; gap: 3px;
      transition: border-color var(--transition);
    }
    .stat-card:hover { border-color: var(--border-2); }

    .stat-label {
      font-size: 8.5px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--text-3);
    }
    .stat-value {
      font-size: 17px; font-weight: 800;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1;
    }
    .stat-card.writes .stat-value { color: var(--violet); }
    .stat-card.reads  .stat-value { color: var(--accent-2); }
    .stat-card.errors .stat-value { color: var(--rose); }

    .port-card {
      background: var(--surface-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      display: flex; flex-direction: column; gap: 3px;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition);
    }
    .port-card:hover { border-color: rgba(6,182,212,0.35); background: rgba(6,182,212,0.04); }
    .port-label { font-size: 8.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-3); }
    .port-value { font-size: 12px; font-weight: 700; font-family: 'SF Mono', 'Fira Code', monospace; color: var(--accent-2); line-height: 1; }

    /* TERMINAL */
    .terminal-wrap {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      background: var(--surface-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .terminal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border-1);
      flex-shrink: 0;
    }

    .terminal-title {
      display: flex; align-items: center; gap: 6px;
      font-size: 9px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--text-3);
    }
    .t-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: 0.5; }

    .event-badge {
      font-size: 9px; font-weight: 600;
      color: var(--text-3);
      background: var(--surface-3);
      border: 1px solid var(--border-1);
      border-radius: 100px;
      padding: 1px 7px;
    }

    .terminal-body {
      flex: 1;
      padding: 8px 10px;
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10.5px; line-height: 1.6;
      overflow-y: auto;
      color: var(--text-2);
    }
    .terminal-body::-webkit-scrollbar { width: 3px; }
    .terminal-body::-webkit-scrollbar-track { background: transparent; }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    .log-line {
      display: flex; align-items: baseline; gap: 8px;
      padding: 1px 3px; border-radius: 3px;
    }
    .log-line:hover { background: rgba(255,255,255,0.02); }
    .log-ts { font-size: 9px; color: var(--text-3); flex-shrink: 0; letter-spacing: -0.2px; }
    .log-msg { flex: 1; word-break: break-all; }
    .log-line .ok   { color: var(--green); }
    .log-line .err  { color: var(--rose); }
    .log-line .info { color: var(--accent-2); }

    .terminal-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 6px; color: var(--text-3);
    }
    .terminal-empty-icon { font-size: 20px; opacity: 0.4; }
    .terminal-empty-text { font-size: 10px; opacity: 0.5; }

    /* FOOTER */
    .footer { display: flex; gap: 6px; flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 5px; padding: 7px 11px;
      border-radius: var(--radius-sm);
      font-size: 10.5px; font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-2);
      background: var(--surface-2);
      color: var(--text-2);
      transition: all var(--transition);
      letter-spacing: 0.1px;
      white-space: nowrap;
    }
    .btn:hover { background: var(--surface-3); border-color: var(--border-3); color: var(--text-1); }
    .btn:active { transform: scale(0.96); }

    .btn-icon { width: 30px; height: 30px; padding: 0; flex-shrink: 0; }

    .btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      border-color: transparent; color: #fff; font-weight: 700;
      box-shadow: 0 1px 0 rgba(255,255,255,0.1) inset, 0 4px 16px rgba(79,70,229,0.3);
    }
    .btn-primary:hover {
      opacity: 0.9; border-color: transparent; color: #fff;
      box-shadow: 0 1px 0 rgba(255,255,255,0.12) inset, 0 6px 20px rgba(79,70,229,0.4);
    }

    .btn-live {
      flex: 1;
      background: rgba(34,211,160,0.08);
      border-color: rgba(34,211,160,0.25);
      color: var(--green);
    }
    .btn-live:hover { background: rgba(34,211,160,0.12); border-color: rgba(34,211,160,0.4); color: var(--green); }

    /* RESIZE GRIP */
    .resize-grip {
      position: fixed; right: 3px; bottom: 3px;
      width: 14px; height: 14px;
      cursor: nwse-resize; opacity: 0.2;
      color: var(--text-2);
      transition: opacity var(--transition), color var(--transition);
      z-index: 1000;
      display: flex; align-items: flex-end; justify-content: flex-end;
    }
    .resize-grip:hover { opacity: 0.7; color: var(--accent-2); }
  </style>
</head>
<body>

  <div class="app">

    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="brand-name">Figma MCP</span>
          <span class="brand-file" id="session-display">READY</span>
        </div>
      </div>

      <div class="status-pill" id="status-pill">
        <div class="dot yellow" id="dot"></div>
        <span id="status-text">Connecting</span>
        <span id="mode-badge" style="display:none;color:var(--text-3)">—</span>
      </div>
    </header>

    <div class="stats-row">
      <div class="stat-card writes" title="Write Operations">
        <span class="stat-label">Writes</span>
        <span class="stat-value" id="write-count">0</span>
      </div>
      <div class="stat-card reads" title="Read Operations">
        <span class="stat-label">Reads</span>
        <span class="stat-value" id="read-count">0</span>
      </div>
      <div class="stat-card errors" title="Errors">
        <span class="stat-label">Errors</span>
        <span class="stat-value" id="err-count">0</span>
      </div>
      <div class="port-card" onclick="changePort()" title="Click to change port">
        <span class="port-label">Port</span>
        <span class="port-value" id="port-display">38451</span>
      </div>
    </div>

    <section class="terminal-wrap">
      <div class="terminal-header">
        <div class="terminal-title">
          <div class="t-dot"></div>
          Stream Console
        </div>
        <span class="event-badge" id="log-count">0 events</span>
      </div>
      <div class="terminal-body" id="log">
        <div class="terminal-empty" id="log-empty">
          <div class="terminal-empty-icon">◌</div>
          <div class="terminal-empty-text">Waiting for events…</div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <button class="btn btn-icon" onclick="clearLog()" title="Clear log">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
        </svg>
      </button>

      <button class="btn btn-primary" id="launch-btn" onclick="launchServer()" title="Start Figma MCP server">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span id="launch-btn-label">Launch Server</span>
      </button>

      <button class="btn btn-icon" onclick="reconnect()" title="Reconnect">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
      </button>
    </footer>

  </div>

  <div class="resize-grip" id="resize-grip" title="Drag to resize">
    <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M9 1L1 9M9 5L5 9"/>
    </svg>
  </div>

  <script>
    var currentPort = 38451;
    var BRIDGE  = "http://localhost:" + currentPort;
    var POLL_MS = 300;
    var POLL_MAX_MS = 3000;
    var LONG_POLL_TIMEOUT = 12000;
    var SHORT_POLL_TIMEOUT = 3000;
    var consecutiveErrors = 0;
    var everConnected = false;
    var lastSuccessfulPollAt = Date.now();
    var sessionId = null;
    var fileName = null;

    var writeCount = 0, readCount = 0, errCount = 0;
    var totalLogEvents = 0;
    var polling = true;

    var logEl         = document.getElementById("log");
    var logEmptyEl    = document.getElementById("log-empty");
    var dotEl         = document.getElementById("dot");
    var statusEl      = document.getElementById("status-text");
    var modeEl        = document.getElementById("mode-badge");
    var logCountEl    = document.getElementById("log-count");
    var sessionDispEl = document.getElementById("session-display");
    var launchBtn     = document.getElementById("launch-btn");
    var launchBtnLabel = document.getElementById("launch-btn-label");
    var statusPill    = document.getElementById("status-pill");

    var READ_OPS = [
      "get_selection","get_design","get_page_nodes","screenshot",
      "get_styles","get_local_components","get_viewport","get_variables",
      "export_svg","get_node_detail","export_image","search_nodes","scan_design"
    ];

    function setStatus(state, text, mode) {
      dotEl.className = "dot " + state;
      statusEl.textContent = text;
      if (mode && modeEl) modeEl.textContent = mode;

      statusPill.className = "status-pill";
      if (state === "green") statusPill.classList.add("connected");
      if (state === "red")   statusPill.classList.add("offline");

      if (launchBtn && launchBtnLabel) {
        launchBtn.className = "btn";
        if (state === "green") {
          launchBtn.classList.add("btn-live");
          launchBtnLabel.textContent = "● Live";
        } else {
          launchBtn.classList.add("btn-primary");
          launchBtnLabel.textContent = state === "yellow" ? "Connecting…" : "Launch Server";
        }
      }
    }

    function launchServer() {
      if (wsConnected) {
        log("Server is already running and connected!", "ok");
        return;
      }
      showSetupGuide();
    }

    function showSetupGuide() {
      var existing = document.getElementById("setup-overlay");
      if (existing) { existing.remove(); return; }

      var overlay = document.createElement("div");
      overlay.id = "setup-overlay";
      Object.assign(overlay.style, {
        position: "fixed", inset: "0",
        background: "rgba(9,9,15,0.96)",
        backdropFilter: "blur(4px)",
        zIndex: "999",
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center",
        padding: "18px", gap: "10px",
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Inter', sans-serif"
      });

      overlay.innerHTML = [
        '<div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(99,102,241,0.4),0 8px 24px rgba(79,70,229,0.4);margin-bottom:2px">',
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
        '</div>',
        '<div style="font-size:14px;font-weight:700;color:#f0f2f8;letter-spacing:-0.2px">Start Figma MCP Server</div>',
        '<div style="font-size:10.5px;color:#8b95b0;text-align:center;max-width:230px;line-height:1.6">Run one of these commands in your terminal:</div>',

        '<div style="width:100%;background:#0f1117;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px">',
          '<div style="font-size:8.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:#4e5873">Option A · Run once</div>',
          '<div style="font-family:\'SF Mono\',monospace;font-size:12px;font-weight:600;color:#38bdf8;user-select:text">npx figma-mcp</div>',
        '</div>',

        '<div style="width:100%;background:#0f1117;border:1px solid rgba(34,211,160,0.15);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px">',
          '<div style="font-size:8.5px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:#4e5873">Option B · Auto-start on login ✦ Recommended</div>',
          '<div style="font-family:\'SF Mono\',monospace;font-size:12px;font-weight:600;color:#22d3a0;user-select:text">npx figma-mcp --install-service</div>',
          '<div style="font-size:9px;color:#4e5873">Sets up LaunchAgent / systemd / Task Scheduler</div>',
        '</div>',

        '<div style="display:flex;align-items:center;gap:6px;font-size:9.5px;color:#4e5873">',
          '<div style="width:5px;height:5px;border-radius:50%;background:#f59e0b;animation:blink 1.4s ease-in-out infinite"></div>',
          'Plugin auto-connects once server is detected',
        '</div>',

        '<button onclick="document.getElementById(\'setup-overlay\').remove();reconnect();" style="',
          'margin-top:4px;padding:7px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);',
          'background:rgba(255,255,255,0.05);color:#8b95b0;font-size:10.5px;font-weight:600;cursor:pointer;',
          'font-family:inherit;letter-spacing:0.1px',
        '">Dismiss & Retry</button>'
      ].join("");

      document.body.appendChild(overlay);

      var checks = 0;
      var checker = setInterval(function() {
        checks++;
        fetch(BRIDGE + "/health", { cache: "no-store", signal: AbortSignal.timeout(400) })
          .then(function(res) {
            if (res.ok) {
              clearInterval(checker);
              var ov = document.getElementById("setup-overlay");
              if (ov) ov.remove();
              log("✓ Server detected — connecting…", "ok");
              reconnect();
            }
          })
          .catch(function() {
            if (checks >= 60) clearInterval(checker);
          });
      }, 500);
    }

    function log(msg, cls) {
      totalLogEvents++;
      if (logCountEl) logCountEl.textContent = totalLogEvents + " events";

      if (logEmptyEl) logEmptyEl.style.display = "none";

      var line = document.createElement("div");
      line.className = "log-line";

      var ts = document.createElement("span");
      ts.className = "log-ts";
      ts.textContent = new Date().toLocaleTimeString("en", { hour12: false });

      var content = document.createElement("span");
      content.className = "log-msg" + (cls ? " " + cls : "");
      content.textContent = msg;

      line.appendChild(ts);
      line.appendChild(content);
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;

      // Trim log buffer: remove oldest entries in one batch DOM op to avoid
      // triggering O(N) reflows from individual removeChild calls.
      if (logEl.children.length > 90) {
        var keep = Array.from(logEl.children).slice(-70);
        logEl.replaceChildren.apply(logEl, keep);
      }
    }

    function clearLog() {
      logEl.innerHTML = "";
      totalLogEvents = 0;
      if (logCountEl) logCountEl.textContent = "0 events";
      var empty = document.createElement("div");
      empty.id = "log-empty";
      empty.className = "terminal-empty";
      empty.innerHTML = '<div class="terminal-empty-icon">◌</div><div class="terminal-empty-text">Waiting for events…</div>';
      logEl.appendChild(empty);
      logEmptyEl = empty;
    }

    function sleep(ms) {
      return new Promise(function(r) { setTimeout(r, ms); });
    }

    function getBackoff() {
      return Math.min(POLL_MS * Math.pow(2, Math.min(consecutiveErrors - 1, 3)), POLL_MAX_MS);
    }

    var ws = null;
    var wsConnected = false;
    var isLongPolling = false;
    var activeAbortController = null;
    var isFirstPoll = true;

    async function initConnection() {
      if (wsConnected) return;

      // 1. Instant Health Check on localhost (< 2ms)
      try {
        var res = await fetch("http://localhost:" + currentPort + "/health", { signal: AbortSignal.timeout(400) });
        if (res.ok) {
          BRIDGE = "http://localhost:" + currentPort;
          everConnected = true;
          lastSuccessfulPollAt = Date.now();
          setStatus("green", "Connected", "ready");
          connectWs();
          return;
        }
      } catch(e) {}

      // 2. Parallel port scan 38451-38455 — all probes fire simultaneously,
      //    winner resolves in ~200ms instead of up to 200ms × 4 sequentially.
      var scanPorts = [38451, 38452, 38453, 38454, 38455].filter(function(p) { return p !== currentPort; });
      try {
        var winner = await Promise.any(scanPorts.map(function(p) {
          return fetch("http://localhost:" + p + "/health", { signal: AbortSignal.timeout(300) })
            .then(function(r) { if (!r.ok) throw new Error("not ok"); return p; });
        }));
        currentPort = winner;
        BRIDGE = "http://localhost:" + winner;
        var pDisp = document.getElementById("port-display");
        if (pDisp) pDisp.textContent = winner;
        everConnected = true;
        lastSuccessfulPollAt = Date.now();
        setStatus("green", "Connected", "ready");
        connectWs();
        return;
      } catch(_) { /* no port found, fall through to WS attempt */ }

      // 3. Attempt WebSocket on currentPort
      connectWs();
    }

    function connectWs() {
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }

      var wsHost = BRIDGE.replace(/^http:\/\//, "ws://");
      var wsUrl = wsHost + "/ws";
      var qs = [];
      if (sessionId) qs.push("sessionId=" + encodeURIComponent(sessionId));
      if (fileName) qs.push("fileName=" + encodeURIComponent(fileName));
      if (qs.length) wsUrl += "?" + qs.join("&");

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        startLongPoll();
        return;
      }

      var pingTimer = null;

      ws.onopen = function() {
        wsConnected = true;
        consecutiveErrors = 0;
        everConnected = true;
        lastSuccessfulPollAt = Date.now();
        setStatus("green", "Connected", "ready");
        log("⚡ Connected to Figma MCP · port " + currentPort, "ok");

        if (pingTimer) clearInterval(pingTimer);
        pingTimer = setInterval(function() {
          if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: "ping" })); } catch(e) {}
          } else {
            clearInterval(pingTimer);
          }
        }, 15000);
      };

      ws.onmessage = function(event) {
        try {
          var req = JSON.parse(event.data);
          if (req && req.operation) {
            log("→ " + req.operation, READ_OPS.indexOf(req.operation) >= 0 ? "info" : "ok");
            // Acknowledge before dispatching: the server re-queues anything it
            // pushed into a socket that died before an ack, and must not
            // re-queue an op the plugin is already running.
            try { ws.send(JSON.stringify({ type: "ack", id: req.id })); } catch(e) {}
            dispatchToMain(req);
          }
        } catch (e) {
          log("WS parse error: " + e.message, "err");
        }
      };

      ws.onerror = function() {
        if (!everConnected) {
          setStatus("yellow", "Connecting…");
        }
      };

      ws.onclose = function() {
        if (pingTimer) clearInterval(pingTimer);
        wsConnected = false;
        if (polling) {
          startLongPoll();
        }
      };
    }

    async function startLongPoll() {
      if (isLongPolling || wsConnected) return;
      isLongPolling = true;

      try {
        while (polling && !wsConnected) {
          var receivedThisRound = 0;
          try {
            var pollUrl = BRIDGE + "/poll";
            var qs = [];
            if (sessionId) qs.push("sessionId=" + encodeURIComponent(sessionId));
            if (fileName) qs.push("fileName=" + encodeURIComponent(fileName));
            if (isFirstPoll) {
              qs.push("init=true");
              isFirstPoll = false;
            }
            if (qs.length) pollUrl += "?" + qs.join("&");

            var fetchTimeout = consecutiveErrors > 0 ? SHORT_POLL_TIMEOUT : LONG_POLL_TIMEOUT;
            var ctrl = new AbortController();
            activeAbortController = ctrl;
            var timeoutId = setTimeout(function() { ctrl.abort(); }, fetchTimeout);
            var res;
            try {
              res = await fetch(pollUrl, { signal: ctrl.signal });
            } finally {
              clearTimeout(timeoutId);
              if (activeAbortController === ctrl) {
                activeAbortController = null;
              }
            }

            if (!res.ok) {
              setStatus("yellow", "Busy");
              consecutiveErrors++;
              await sleep(getBackoff());
              continue;
            }

            var body = await res.json();
            var reqs = body.requests || [];
            receivedThisRound = reqs.length;
            setStatus("green", reqs.length ? reqs.length + " cmd" : "Connected", body.mode || "ready");

            consecutiveErrors = 0;
            everConnected = true;
            lastSuccessfulPollAt = Date.now();

            for (var i = 0; i < reqs.length; i++) {
              var req = reqs[i];
              log("→ " + req.operation, READ_OPS.indexOf(req.operation) >= 0 ? "info" : "ok");
              dispatchToMain(req);
            }
          } catch (e) {
            if (!polling) break;
            consecutiveErrors++;
            var backoff = getBackoff();
            if (consecutiveErrors <= 5) {
              setStatus("yellow", "Connecting (" + consecutiveErrors + ")");
            } else if (consecutiveErrors <= 10) {
              setStatus("yellow", "Retrying…");
            } else {
              setStatus("red", "Offline");
            }
            await sleep(backoff);
            continue;
          }
          // Re-poll immediately after a round that carried work: the next op in
          // a read chain is usually already queued, and sleeping here added
          // POLL_MS of dead time to every single round-trip.
          if (!receivedThisRound) await sleep(POLL_MS);
        }
      } finally {
        isLongPolling = false;
      }
    }

    // dataJson is already-serialized JSON produced by the main thread, so it is
    // spliced into the body as-is — a multi-MB design tree is never re-encoded
    // here. Older builds of code.js send a plain `data` object instead.
    function buildResponseBody(id, success, dataJson, error) {
      return '{"id":' + JSON.stringify(id) +
        ',"success":' + (success ? "true" : "false") +
        ',"data":' + (dataJson === undefined || dataJson === null ? "null" : dataJson) +
        ',"error":' + (error === undefined || error === null ? "null" : JSON.stringify(String(error))) +
        '}';
    }

    async function sendResponse(id, success, dataJson, error) {
      var body = buildResponseBody(id, success, dataJson, error);

      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(body);
          return;
        } catch(e) {}
      }

      // HTTP fallback
      try {
        await fetch(BRIDGE + "/response", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body
        });
      } catch (e) {
        log("Response failed: " + e.message, "err");
      }
    }

    function dispatchToMain(req) {
      parent.postMessage({ pluginMessage: req }, "*");
    }

    function reconnect() {
      polling = false;
      isFirstPoll = true;
      consecutiveErrors = 0;
      setStatus("yellow", "Reconnecting…");
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch(e) {}
      }
      setTimeout(function() {
        polling = true;
        initConnection();
      }, 100);
    }

    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState !== "visible" || !everConnected) return;
      var idleMs = Date.now() - lastSuccessfulPollAt;
      if (!wsConnected || consecutiveErrors > 0 || activeAbortController || idleMs > 20000) {
        log("Focus sync (" + Math.round(idleMs / 1000) + "s)", "info");
        reconnect();
      }
    });

    window.addEventListener("focus", function() {
      if (!everConnected) return;
      var idleMs = Date.now() - lastSuccessfulPollAt;
      if (!wsConnected || consecutiveErrors > 0 || activeAbortController || idleMs > 20000) {
        log("Window focus sync", "info");
        reconnect();
      }
    });

    function changePort() {
      var input = prompt("MCP Bridge Port:", currentPort);
      if (!input) return;
      var newPort = parseInt(input, 10);
      if (isNaN(newPort) || newPort < 1024 || newPort > 65535) {
        alert("Invalid port number");
        return;
      }
      setPort(newPort);
    }

    function setPort(port) {
      currentPort = port;
      BRIDGE = "http://localhost:" + currentPort;
      document.getElementById("port-display").textContent = currentPort;
      log("Port switched → " + currentPort, "info");
      reconnect();
    }

    async function autoDetectPort() {
      setStatus("yellow", "Scanning…");
      log("Scanning 38451-38460…", "info");
      for (var p = 38451; p <= 38460; p++) {
        try {
          var res = await fetch("http://localhost:" + p + "/health", { signal: AbortSignal.timeout(400) });
          if (res.ok) {
            var data = await res.json();
            log("Detected port " + p, "ok");
            setPort(p);
            return;
          }
        } catch(e) {}
      }
      log("Not found on 38451-38460 → Reset 38451", "err");
      setPort(38451);
    }

    window.onmessage = async function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "session-info") {
        var prevSid = sessionId;
        sessionId = msg.sessionId || null;
        fileName = msg.fileName || null;
        if (fileName && sessionDispEl) {
          sessionDispEl.textContent = fileName.length > 16 ? fileName.slice(0, 14) + ".." : fileName;
        }
        if (sessionId) log("Linked: " + (fileName || sessionId), "info");
        if (sessionId && sessionId !== prevSid) {
          reconnect();
        }
        return;
      }

      if (msg.type === "selection-change") {
        if (sessionDispEl) {
          if (msg.count === 0) {
            sessionDispEl.textContent = fileName ? (fileName.length > 16 ? fileName.slice(0, 14) + ".." : fileName) : "READY";
          } else if (msg.count === 1) {
            var nName = msg.selection[0].name;
            sessionDispEl.textContent = "Sel: " + (nName.length > 12 ? nName.slice(0, 10) + ".." : nName);
          } else {
            sessionDispEl.textContent = msg.count + " layers selected";
          }
        }
        return;
      }

      var isRead = READ_OPS.indexOf(msg.operation) >= 0;
      if (msg.success) {
        if (isRead) {
          readCount++;
          document.getElementById("read-count").textContent = readCount;
        } else {
          writeCount++;
          document.getElementById("write-count").textContent = writeCount;
        }
        log("✓ " + (msg.id ? msg.id.slice(-6) : "ok"), "ok");
      } else {
        errCount++;
        document.getElementById("err-count").textContent = errCount;
        log("✗ " + (msg.id ? msg.id.slice(-6) : "err") + ": " + (msg.error || "fail"), "err");
      }
      var payloadJson = msg.dataJson !== undefined
        ? msg.dataJson
        : (msg.data !== undefined ? JSON.stringify(msg.data) : null);
      await sendResponse(msg.id, msg.success, payloadJson, msg.error);
    };

    initConnection();

    // Smooth Drag Resize
    (function initResize() {
      var grip = document.getElementById("resize-grip");
      if (!grip) return;

      grip.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        grip.setPointerCapture(e.pointerId);
        var startX = e.clientX;
        var startY = e.clientY;
        var startW = window.innerWidth;
        var startH = window.innerHeight;

        function onPointerMove(ev) {
          var nw = Math.max(280, Math.min(1000, Math.round(startW + (ev.clientX - startX))));
          var nh = Math.max(220, Math.min(1200, Math.round(startH + (ev.clientY - startY))));
          parent.postMessage({ pluginMessage: { type: "resize", width: nw, height: nh } }, "*");
        }

        function onPointerUp(ev) {
          try { grip.releasePointerCapture(ev.pointerId); } catch(err) {}
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerup", onPointerUp);
        }

        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
      });
    })();
  </script>
</body>
</html>
