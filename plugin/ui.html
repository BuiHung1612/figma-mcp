<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma MCP Console</title>
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: #111827;
      --bg-panel: #0d131f;
      --bg-active: #1f293d;
      --border: #1e293b;
      --border-bright: #334155;
      --text-white: #f8fafc;
      --text-dim: #94a3b8;
      --text-dark: #64748b;
      --cyan: #38bdf8;
      --indigo: #818cf8;
      --emerald: #34d399;
      --amber: #fbbf24;
      --rose: #fb7185;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;
      background: var(--bg-main);
      color: var(--text-white);
      padding: 10px;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Top Command Header */
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 10px;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .brand-icon {
      width: 22px;
      height: 22px;
      border-radius: 5px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 11px;
      box-shadow: 0 0 8px rgba(79, 70, 229, 0.4);
    }

    .brand-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: #fff;
    }

    .brand-sub {
      font-size: 9px;
      color: var(--text-dark);
      margin-left: 2px;
      font-weight: 500;
    }

    .status-capsule {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .radar-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      transition: all 0.3s;
    }
    .radar-dot.green  { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
    .radar-dot.yellow { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: pulse 1s infinite; }
    .radar-dot.red    { background: var(--rose); box-shadow: 0 0 6px var(--rose); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    /* Telemetry & Port Bar */
    .hud-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .metric-chip {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .metric-chip .val {
      font-size: 13px;
      font-weight: 800;
      font-family: 'SF Mono', monospace;
    }

    .metric-chip.w .val { color: var(--indigo); }
    .metric-chip.r .val { color: var(--cyan); }
    .metric-chip.e .val { color: var(--rose); }

    .port-box {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 7px;
      font-size: 9.5px;
      color: var(--text-dim);
    }

    .port-link {
      font-family: 'SF Mono', monospace;
      font-weight: 700;
      color: var(--cyan);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Terminal Console */
    .terminal-deck {
      flex: 1;
      min-height: 0;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 5px 8px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-dark);
      flex-shrink: 0;
    }

    .terminal-body {
      flex: 1;
      padding: 8px;
      font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 10px;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      color: #94a3b8;
    }

    .terminal-body::-webkit-scrollbar { width: 3px; }
    .terminal-body::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .log-line {
      display: flex;
      gap: 6px;
      margin-bottom: 2px;
    }

    .log-time {
      color: #475569;
      font-size: 9px;
      flex-shrink: 0;
    }

    .log-line .ok   { color: var(--emerald); font-weight: 600; }
    .log-line .err  { color: var(--rose); font-weight: 600; }
    .log-line .info { color: var(--cyan); }

    /* Action Footer Bar */
    .action-deck {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-dim);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .btn:hover {
      background: var(--bg-active);
      border-color: var(--border-bright);
      color: var(--text-white);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn.primary {
      flex: 1;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 10px rgba(79, 70, 229, 0.3);
    }

    .btn.primary:hover {
      opacity: 0.92;
      box-shadow: 0 0 14px rgba(79, 70, 229, 0.45);
    }

    /* Corner Resize Grip */
    .resize-grip {
      position: fixed;
      right: 2px;
      bottom: 2px;
      width: 14px;
      height: 14px;
      cursor: nwse-resize;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 1px;
      opacity: 0.35;
      color: var(--text-dim);
      transition: opacity 0.2s, color 0.2s;
      user-select: none;
      z-index: 1000;
    }
    .resize-grip:hover {
      opacity: 0.9;
      color: var(--cyan);
    }
  </style>
</head>
<body>

  <!-- Top Command Header -->
  <header class="hud-header">
    <div class="brand-group">
      <div class="brand-icon">⚡</div>
      <div>
        <span class="brand-title">FIGMA MCP</span>
        <span class="brand-sub" id="session-display">READY</span>
      </div>
    </div>
    <div class="status-capsule">
      <div class="radar-dot yellow" id="dot"></div>
      <span id="status-text">Connecting...</span>
      <span id="mode-badge" style="display:none">—</span>
    </div>
  </header>

  <!-- Telemetry Strip -->
  <section class="hud-strip">
    <div class="metric-chip w" title="Write Operations">
      <span>WRITES</span>
      <span class="val" id="write-count">0</span>
    </div>
    <div class="metric-chip r" title="Read Operations">
      <span>READS</span>
      <span class="val" id="read-count">0</span>
    </div>
    <div class="metric-chip e" title="Errors">
      <span>ERR</span>
      <span class="val" id="err-count">0</span>
    </div>
    <div class="port-box">
      <span>PORT</span>
      <span class="port-link" id="port-display" onclick="changePort()" title="Change Port">38451</span>
    </div>
  </section>

  <!-- Terminal Console -->
  <section class="terminal-deck">
    <div class="terminal-bar">
      <span>STREAM CONSOLE</span>
      <span id="log-count">0 events</span>
    </div>
    <div class="terminal-body" id="log"></div>
  </section>

  <!-- Action Deck -->
  <footer class="action-deck">
    <button class="btn" onclick="clearLog()">Clear</button>
    <button class="btn primary" id="launch-btn" onclick="launchServer()" title="Auto-launch local Figma MCP server">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
      </svg>
      <span id="launch-btn-label">⚡ Launch Server</span>
    </button>
    <button class="btn" onclick="reconnect()" title="Reconnect">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </button>
  </footer>

  <!-- Corner Resize Grip -->
  <div class="resize-grip" id="resize-grip" title="Drag to resize window">
    <svg width="9" height="9" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M9 1L1 9M9 5L5 9M9 9L9 9"/>
    </svg>
  </div>

  <script>
    var currentPort = 38451;
    var BRIDGE  = "http://localhost:" + currentPort;
    var POLL_MS = 300;
    var POLL_MAX_MS = 3000;
    var LONG_POLL_TIMEOUT = 12000;
    var SHORT_POLL_TIMEOUT = 3000;
    var consecutiveErrors = 0;
    var everConnected = false;
    var lastSuccessfulPollAt = Date.now();
    var sessionId = null;
    var fileName = null;

    var writeCount = 0, readCount = 0, errCount = 0;
    var totalLogEvents = 0;
    var polling = true;

    var logEl         = document.getElementById("log");
    var dotEl         = document.getElementById("dot");
    var statusEl      = document.getElementById("status-text");
    var modeEl        = document.getElementById("mode-badge");
    var logCountEl    = document.getElementById("log-count");
    var sessionDispEl = document.getElementById("session-display");
    var launchBtn     = document.getElementById("launch-btn");
    var launchBtnLabel = document.getElementById("launch-btn-label");

    var READ_OPS = [
      "get_selection","get_design","get_page_nodes","screenshot",
      "get_styles","get_local_components","get_viewport","get_variables",
      "export_svg","get_node_detail","export_image","search_nodes","scan_design"
    ];

    function setStatus(state, text, mode) {
      dotEl.className = "radar-dot " + state;
      statusEl.textContent = text;
      if (mode && modeEl) modeEl.textContent = mode;

      if (launchBtn && launchBtnLabel) {
        if (state === "green") {
          launchBtnLabel.textContent = "Live";
          launchBtn.classList.remove("primary");
        } else if (state === "yellow") {
          launchBtnLabel.textContent = "Connecting...";
          launchBtn.classList.add("primary");
        } else {
          launchBtnLabel.textContent = "⚡ Launch Server";
          launchBtn.classList.add("primary");
        }
      }
    }

    function launchServer() {
      if (wsConnected) {
        log("Server is already running and connected!", "ok");
        return;
      }
      log("⚡ Launching Figma MCP via OS protocol (figma-mcp://start)...", "info");
      setStatus("yellow", "Launching...");

      // Invoke OS protocol scheme figma-mcp://start
      var a = document.createElement("a");
      a.href = "figma-mcp://start";
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // Fast-poll every 350ms to detect server coming up
      var checks = 0;
      var checker = setInterval(function() {
        checks++;
        fetch(BRIDGE + "/", { cache: "no-store" })
          .then(function(res) {
            if (res.ok) {
              clearInterval(checker);
              log("✓ Figma MCP server is online! Connecting...", "ok");
              reconnect();
            }
          })
          .catch(function() {
            if (checks >= 25) {
              clearInterval(checker);
              log("💡 Tip: If server hasn't started, run 'npx figma-mcp' in terminal once to initialize protocol", "err");
              setStatus("red", "Offline");
            }
          });
      }, 350);
    }

    function log(msg, cls) {
      totalLogEvents++;
      if (logCountEl) logCountEl.textContent = totalLogEvents + " events";

      var line = document.createElement("div");
      line.className = "log-line";

      var ts = document.createElement("span");
      ts.className = "log-time";
      ts.textContent = new Date().toLocaleTimeString("en", { hour12: false });

      var content = document.createElement("span");
      if (cls) content.className = cls;
      content.textContent = msg;

      line.appendChild(ts);
      line.appendChild(content);
      logEl.appendChild(line);
      logEl.scrollTop = logEl.scrollHeight;

      while (logEl.children.length > 80) {
        logEl.removeChild(logEl.firstChild);
      }
    }

    function clearLog() {
      logEl.innerHTML = "";
      totalLogEvents = 0;
      if (logCountEl) logCountEl.textContent = "0 events";
    }

    function sleep(ms) {
      return new Promise(function(r) { setTimeout(r, ms); });
    }

    function getBackoff() {
      return Math.min(POLL_MS * Math.pow(2, Math.min(consecutiveErrors - 1, 3)), POLL_MAX_MS);
    }

    var ws = null;
    var wsConnected = false;
    var isLongPolling = false;
    var activeAbortController = null;
    var isFirstPoll = true;

    async function initConnection() {
      if (wsConnected) return;

      // 1. Instant Health Check on localhost (< 2ms)
      try {
        var res = await fetch("http://localhost:" + currentPort + "/health", { signal: AbortSignal.timeout(400) });
        if (res.ok) {
          BRIDGE = "http://localhost:" + currentPort;
          everConnected = true;
          lastSuccessfulPollAt = Date.now();
          setStatus("green", "Connected", "ready");
          connectWs();
          return;
        }
      } catch(e) {}

      // 2. Quick auto-detect ports 38451-38455 if currentPort is not answering
      for (var p = 38451; p <= 38455; p++) {
        if (p === currentPort) continue;
        try {
          var resScan = await fetch("http://localhost:" + p + "/health", { signal: AbortSignal.timeout(200) });
          if (resScan.ok) {
            currentPort = p;
            BRIDGE = "http://localhost:" + p;
            var pDisp = document.getElementById("port-display");
            if (pDisp) pDisp.textContent = p;
            everConnected = true;
            lastSuccessfulPollAt = Date.now();
            setStatus("green", "Connected", "ready");
            connectWs();
            return;
          }
        } catch(eScan) {}
      }

      // 3. Attempt WebSocket on currentPort
      connectWs();
    }

    function connectWs() {
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }

      var wsHost = BRIDGE.replace(/^http:\/\//, "ws://");
      var wsUrl = wsHost + "/ws";
      var qs = [];
      if (sessionId) qs.push("sessionId=" + encodeURIComponent(sessionId));
      if (fileName) qs.push("fileName=" + encodeURIComponent(fileName));
      if (qs.length) wsUrl += "?" + qs.join("&");

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        startLongPoll();
        return;
      }

      var pingTimer = null;

      ws.onopen = function() {
        wsConnected = true;
        consecutiveErrors = 0;
        everConnected = true;
        lastSuccessfulPollAt = Date.now();
        setStatus("green", "Connected", "ready");
        log("⚡ Connected to Figma MCP · " + currentPort, "ok");

        if (pingTimer) clearInterval(pingTimer);
        pingTimer = setInterval(function() {
          if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify({ type: "ping" })); } catch(e) {}
          } else {
            clearInterval(pingTimer);
          }
        }, 15000);
      };

      ws.onmessage = function(event) {
        try {
          var req = JSON.parse(event.data);
          if (req && req.operation) {
            log("→ " + req.operation, READ_OPS.indexOf(req.operation) >= 0 ? "info" : "ok");
            // Acknowledge before dispatching: the server re-queues anything it
            // pushed into a socket that died before an ack, and must not
            // re-queue an op the plugin is already running.
            try { ws.send(JSON.stringify({ type: "ack", id: req.id })); } catch(e) {}
            dispatchToMain(req);
          }
        } catch (e) {
          log("WS parse error: " + e.message, "err");
        }
      };

      ws.onerror = function() {
        if (!everConnected) {
          setStatus("yellow", "Connecting...");
        }
      };

      ws.onclose = function() {
        if (pingTimer) clearInterval(pingTimer);
        wsConnected = false;
        if (polling) {
          startLongPoll();
        }
      };
    }

    async function startLongPoll() {
      if (isLongPolling || wsConnected) return;
      isLongPolling = true;

      try {
        while (polling && !wsConnected) {
          var receivedThisRound = 0;
          try {
            var pollUrl = BRIDGE + "/poll";
            var qs = [];
            if (sessionId) qs.push("sessionId=" + encodeURIComponent(sessionId));
            if (fileName) qs.push("fileName=" + encodeURIComponent(fileName));
            if (isFirstPoll) {
              qs.push("init=true");
              isFirstPoll = false;
            }
            if (qs.length) pollUrl += "?" + qs.join("&");

            var fetchTimeout = consecutiveErrors > 0 ? SHORT_POLL_TIMEOUT : LONG_POLL_TIMEOUT;
            var ctrl = new AbortController();
            activeAbortController = ctrl;
            var timeoutId = setTimeout(function() { ctrl.abort(); }, fetchTimeout);
            var res;
            try {
              res = await fetch(pollUrl, { signal: ctrl.signal });
            } finally {
              clearTimeout(timeoutId);
              if (activeAbortController === ctrl) {
                activeAbortController = null;
              }
            }

            if (!res.ok) {
              setStatus("yellow", "Busy");
              consecutiveErrors++;
              await sleep(getBackoff());
              continue;
            }

            var body = await res.json();
            var reqs = body.requests || [];
            receivedThisRound = reqs.length;
            setStatus("green", reqs.length ? reqs.length + " cmd" : "Connected", body.mode || "ready");

            consecutiveErrors = 0;
            everConnected = true;
            lastSuccessfulPollAt = Date.now();

            for (var i = 0; i < reqs.length; i++) {
              var req = reqs[i];
              log("→ " + req.operation, READ_OPS.indexOf(req.operation) >= 0 ? "info" : "ok");
              dispatchToMain(req);
            }
          } catch (e) {
            if (!polling) break;
            consecutiveErrors++;
            var backoff = getBackoff();
            if (consecutiveErrors <= 5) {
              setStatus("yellow", "Connecting (" + consecutiveErrors + ")");
            } else if (consecutiveErrors <= 10) {
              setStatus("yellow", "Retrying...");
            } else {
              setStatus("red", "Offline");
            }
            await sleep(backoff);
            continue;
          }
          // Re-poll immediately after a round that carried work: the next op in
          // a read chain is usually already queued, and sleeping here added
          // POLL_MS of dead time to every single round-trip.
          if (!receivedThisRound) await sleep(POLL_MS);
        }
      } finally {
        isLongPolling = false;
      }
    }

    // dataJson is already-serialized JSON produced by the main thread, so it is
    // spliced into the body as-is — a multi-MB design tree is never re-encoded
    // here. Older builds of code.js send a plain `data` object instead.
    function buildResponseBody(id, success, dataJson, error) {
      return '{"id":' + JSON.stringify(id) +
        ',"success":' + (success ? "true" : "false") +
        ',"data":' + (dataJson === undefined || dataJson === null ? "null" : dataJson) +
        ',"error":' + (error === undefined || error === null ? "null" : JSON.stringify(String(error))) +
        '}';
    }

    async function sendResponse(id, success, dataJson, error) {
      var body = buildResponseBody(id, success, dataJson, error);

      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(body);
          return;
        } catch(e) {}
      }

      // HTTP fallback
      try {
        await fetch(BRIDGE + "/response", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body
        });
      } catch (e) {
        log("Response failed: " + e.message, "err");
      }
    }

    function dispatchToMain(req) {
      parent.postMessage({ pluginMessage: req }, "*");
    }

    function reconnect() {
      polling = false;
      isFirstPoll = true;
      consecutiveErrors = 0;
      setStatus("yellow", "Reconnecting...");
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch(e) {}
      }
      setTimeout(function() {
        polling = true;
        initConnection();
      }, 100);
    }

    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState !== "visible" || !everConnected) return;
      var idleMs = Date.now() - lastSuccessfulPollAt;
      if (!wsConnected || consecutiveErrors > 0 || activeAbortController || idleMs > 20000) {
        log("Focus sync (" + Math.round(idleMs / 1000) + "s)", "info");
        reconnect();
      }
    });

    window.addEventListener("focus", function() {
      if (!everConnected) return;
      var idleMs = Date.now() - lastSuccessfulPollAt;
      if (!wsConnected || consecutiveErrors > 0 || activeAbortController || idleMs > 20000) {
        log("Window focus sync", "info");
        reconnect();
      }
    });

    function changePort() {
      var input = prompt("MCP Bridge Port:", currentPort);
      if (!input) return;
      var newPort = parseInt(input, 10);
      if (isNaN(newPort) || newPort < 1024 || newPort > 65535) {
        alert("Invalid port number");
        return;
      }
      setPort(newPort);
    }

    function setPort(port) {
      currentPort = port;
      BRIDGE = "http://localhost:" + currentPort;
      document.getElementById("port-display").textContent = currentPort;
      log("Port switched → " + currentPort, "info");
      reconnect();
    }

    async function autoDetectPort() {
      setStatus("yellow", "Scanning...");
      log("Scanning 38451-38460...", "info");
      for (var p = 38451; p <= 38460; p++) {
        try {
          var res = await fetch("http://localhost:" + p + "/health", { signal: AbortSignal.timeout(400) });
          if (res.ok) {
            var data = await res.json();
            log("Detected port " + p, "ok");
            setPort(p);
            return;
          }
        } catch(e) {}
      }
      log("Not found on 38451-38460 → Reset 38451", "err");
      setPort(38451);
    }

    window.onmessage = async function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "session-info") {
        var prevSid = sessionId;
        sessionId = msg.sessionId || null;
        fileName = msg.fileName || null;
        if (fileName && sessionDispEl) {
          sessionDispEl.textContent = fileName.length > 16 ? fileName.slice(0, 14) + ".." : fileName;
        }
        if (sessionId) log("Linked: " + (fileName || sessionId), "info");
        if (sessionId && sessionId !== prevSid) {
          reconnect();
        }
        return;
      }

      if (msg.type === "selection-change") {
        if (sessionDispEl) {
          if (msg.count === 0) {
            sessionDispEl.textContent = fileName ? (fileName.length > 16 ? fileName.slice(0, 14) + ".." : fileName) : "READY";
          } else if (msg.count === 1) {
            var nName = msg.selection[0].name;
            sessionDispEl.textContent = "Sel: " + (nName.length > 12 ? nName.slice(0, 10) + ".." : nName);
          } else {
            sessionDispEl.textContent = msg.count + " layers selected";
          }
        }
        return;
      }

      var isRead = READ_OPS.indexOf(msg.operation) >= 0;
      if (msg.success) {
        if (isRead) {
          readCount++;
          document.getElementById("read-count").textContent = readCount;
        } else {
          writeCount++;
          document.getElementById("write-count").textContent = writeCount;
        }
        log("✓ " + (msg.id ? msg.id.slice(-6) : "ok"), "ok");
      } else {
        errCount++;
        document.getElementById("err-count").textContent = errCount;
        log("✗ " + (msg.id ? msg.id.slice(-6) : "err") + ": " + (msg.error || "fail"), "err");
      }
      var payloadJson = msg.dataJson !== undefined
        ? msg.dataJson
        : (msg.data !== undefined ? JSON.stringify(msg.data) : null);
      await sendResponse(msg.id, msg.success, payloadJson, msg.error);
    };

    initConnection();

    // Smooth Drag Resize
    (function initResize() {
      var grip = document.getElementById("resize-grip");
      if (!grip) return;

      grip.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        grip.setPointerCapture(e.pointerId);
        var startX = e.clientX;
        var startY = e.clientY;
        var startW = window.innerWidth;
        var startH = window.innerHeight;

        function onPointerMove(ev) {
          var nw = Math.max(280, Math.min(1000, Math.round(startW + (ev.clientX - startX))));
          var nh = Math.max(220, Math.min(1200, Math.round(startH + (ev.clientY - startY))));
          parent.postMessage({ pluginMessage: { type: "resize", width: nw, height: nh } }, "*");
        }

        function onPointerUp(ev) {
          try { grip.releasePointerCapture(ev.pointerId); } catch(err) {}
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerup", onPointerUp);
        }

        window.addEventListener("pointermove", onPointerMove);
        window.addEventListener("pointerup", onPointerUp);
      });
    })();
  </script>
</body>
