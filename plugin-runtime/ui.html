<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Figma Rust MCP</title>
  <style>
    /* ── RETRO DESIGN SYSTEM (cream paper, ink borders, hard offset shadows) ── */
    :root {
      --bg:             #fdf1dc;
      --surface-base:   #fffaf0;
      --surface-card:   #fffdf7;
      --surface-hover:  #fff3d6;
      --surface-active: #ffe9b8;

      --ink:            #1c1a17;
      --border-subtle:  #1c1a17;
      --border-light:   #1c1a17;
      --border-ghost:   #1c1a17;
      --hairline:       rgba(28, 26, 23, 0.14);
      --dots:           rgba(28, 26, 23, 0.10);

      --text-primary:   #1c1a17;
      --text-secondary: #4a453d;
      --text-muted:     #7d7567;
      --text-dim:       #b3aa99;

      /* Retro palette (legacy --ghost-* names kept for JS/inline references) */
      --yellow:         #ffd34e;
      --pink:           #ffb1c8;
      --blue:           #9dd7fb;
      --green:          #a8e6a1;
      --red:            #f4532c;
      --peach:          #ffb88a;
      --ghost-lavender: #c2410c;
      --ghost-glow:     rgba(255, 211, 78, 0.45);
      --ghost-mint:     #2f8f3a;
      --ghost-mint-glow:rgba(47, 143, 58, 0.20);
      --ghost-cyan:     #1f6fa8;
      --ghost-peach:    #c2410c;
      --ghost-rose:     #d93a14;
      --ghost-amber:    #b7791f;

      --radius-xs:      5px;
      --radius-sm:      7px;
      --radius-md:      9px;
      --radius-full:    9999px;

      --shadow-sm:      2px 2px 0 var(--ink);
      --shadow:         3px 3px 0 var(--ink);
      --border:         2px solid var(--ink);

      --font-ui:        ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      --font-mono:      ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, monospace;
      --transition:     0.12s ease-out;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 12px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      display: flex;
      flex-direction: column;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 8px 10px 10px 8px;
      gap: 8px;
    }

    /* Shared retro "card": ink border + hard shadow */
    .header, .selection-card, .terminal-wrap, .telemetry-cell, .modal-card {
      background: var(--surface-card);
      border: var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow);
    }

    /* Shared retro "button": press-down on click */
    .header-icon-btn, .status-pill, .act-btn, .btn {
      border: var(--border);
      background: var(--surface-card);
      color: var(--ink);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
    }
    .header-icon-btn:hover, .status-pill:hover, .act-btn:hover, .btn:hover { background: var(--surface-hover); }
    .header-icon-btn:active, .status-pill:active, .act-btn:active, .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--ink);
    }
    button:disabled { cursor: wait; opacity: 0.55; }

    /* ── HEADER ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      flex-shrink: 0;
    }

    /* ── INDEXING PROGRESS BAR ── */
    .index-progress-wrap {
      display: none;
      flex-direction: column;
      gap: 4px;
      padding: 5px 8px 6px;
      background: var(--yellow);
      border: var(--border);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow-sm);
      animation: fadeIn 0.2s ease-out;
    }
    .index-progress-wrap.active { display: flex; }
    .index-progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 700;
      color: var(--ink);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .index-progress-label {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .index-progress-label svg { flex-shrink: 0; }
    .index-progress-wrap[aria-busy="true"] svg { animation: spin 1s linear infinite; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: translateY(0); } }

    .brand { display: flex; align-items: center; gap: 7px; min-width: 0; flex: 1; overflow: hidden; }
    .brand-logo {
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--yellow);
      border: var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--ink);
    }
    .brand-logo svg { stroke: var(--ink); }
    .brand-info { display: flex; flex-direction: column; min-width: 0; }
    .brand-title-row { display: flex; align-items: baseline; gap: 5px; min-width: 0; }
    .brand-name { overflow: hidden; text-overflow: ellipsis; }
    .brand-ver { flex-shrink: 0; }
    @media (max-width: 380px) { .brand-ver { display: none; } }
    .brand-name { font-size: 13px; font-weight: 800; white-space: nowrap; letter-spacing: -0.02em; color: var(--ink); line-height: 1.05; }
    .brand-ver {
      font-size: 8.5px; font-weight: 700; color: var(--ink); font-family: var(--font-mono);
      background: var(--yellow); border: 1.5px solid var(--ink); border-radius: var(--radius-full); padding: 0 5px;
    }
    .brand-file {
      font-size: 10px;
      color: var(--text-secondary);
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
      margin-top: 2px;
      font-family: var(--font-mono);
    }

    .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .header-icon-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .header-icon-btn.indexing { background: var(--yellow); }
    .header-icon-btn.indexing svg { animation: spin 1s linear infinite; }

    .status-pill {
      appearance: none;
      display: flex; align-items: center; gap: 5px;
      border-radius: var(--radius-full);
      min-height: 28px;
      padding: 4px 9px 4px 7px;
      font-size: 10px; font-weight: 700;
      font-family: var(--font-mono);
    }
    .status-pill.connected  { background: var(--green); }
    .status-pill.offline    { background: var(--pink); }
    .status-pill.connecting { background: var(--yellow); }
    .status-pill.connected:hover, .status-pill.offline:hover, .status-pill.connecting:hover { filter: brightness(1.04); }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%; flex-shrink: 0;
      border: 1.5px solid var(--ink);
    }
    .dot.green  { background: #3fbf4f; }
    .dot.yellow { background: #ff9f1c; animation: pulse 1.4s ease-in-out infinite; }
    .dot.red    { background: var(--red); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* ── SELECTION INSPECTOR ── */
    .selection-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 7px;
      padding: 7px 8px;
      flex-shrink: 0;
      background-color: var(--surface-card);
      background-image: radial-gradient(var(--dots) 1px, transparent 1px);
      background-size: 10px 10px;
      transition: background-color var(--transition);
    }
    .selection-card.has-selection { background-color: #fff6dc; }

    .selection-main {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
    }

    .selection-icon-wrap {
      width: 24px; height: 24px;
      border-radius: var(--radius-xs);
      background: var(--surface-base);
      border: var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      color: var(--text-muted);
    }
    .selection-card.has-selection .selection-icon-wrap { background: var(--yellow); color: var(--ink); }

    .selection-text { display: flex; flex-direction: column; min-width: 0; }
    .selection-name {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .selection-meta {
      font-size: 9px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .selection-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }

    .act-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 26px;
      padding: 0 6px;
      border-radius: var(--radius-xs);
      font-size: 9.5px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.3px;
    }
    .act-btn.icon-only { width: 26px; padding: 0; }
    .act-btn.badge-btn { background: var(--yellow); text-transform: uppercase; }
    .act-btn.badge-btn:hover { background: #ffc92a; }

    /* ── TELEMETRY: colored stat tiles ── */
    .telemetry-ribbon {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      flex-shrink: 0;
    }
    .telemetry-cell {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      padding: 5px 7px 6px;
      gap: 2px;
      border-radius: var(--radius-sm);
    }
    .telemetry-cell.writes { background: var(--yellow); }
    .telemetry-cell.reads  { background: var(--pink); }
    .telemetry-cell.speed  { background: var(--blue); }
    .telemetry-cell.ram    { background: var(--green); }

    .telemetry-label {
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      color: var(--ink);
      font-family: var(--font-mono);
      opacity: 0.8;
    }
    .telemetry-value {
      font-size: 15px;
      font-weight: 800;
      font-family: var(--font-ui);
      color: var(--ink);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      display: flex;
      align-items: baseline;
      gap: 1.5px;
    }
    .telemetry-unit { font-size: 9px; font-weight: 700; color: var(--ink); opacity: 0.7; }

    /* ── STREAM CONSOLE ── */
    .terminal-wrap {
      flex: 1; min-height: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .terminal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 7px;
      background: var(--surface-base);
      border-bottom: var(--border);
      flex-shrink: 0;
    }

    /* Segmented control, like the "Tibo time / Local time" toggle */
    .terminal-tabs {
      display: flex; align-items: center;
      border: var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      background: var(--surface-card);
    }
    .t-tab {
      font-size: 9px;
      font-weight: 700;
      font-family: var(--font-ui);
      min-height: 22px;
      padding: 2px 5px;
      white-space: nowrap;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background var(--transition);
    }
    .t-tab + .t-tab { border-left: 1.5px solid var(--ink); }
    .t-tab:hover { background: var(--surface-hover); color: var(--ink); }
    .t-tab.active { color: var(--ink); background: var(--yellow); }
    .t-tab.tab-err.active { background: var(--pink); }
    :focus-visible { outline: 2px dashed var(--red); outline-offset: 2px; }
    .modal-input:focus-visible { outline: none; }
    .tab-badge-err {
      font-size: 8.5px;
      font-weight: 800;
      color: #fff;
      background: var(--red);
      border: 1px solid var(--ink);
      border-radius: var(--radius-full);
      padding: 0 4px;
      margin-left: 2px;
      line-height: 1.3;
      display: inline-block;
    }

    .terminal-meta { display: flex; align-items: center; gap: 4px; }
    .terminal-meta .act-btn.icon-only { width: 22px; min-height: 22px; height: 22px !important; width: 22px !important; }

    .event-badge {
      font-size: 8.5px;
      font-weight: 700;
      font-family: var(--font-mono);
      color: var(--ink);
      background: var(--surface-card);
      border: 1.5px solid var(--ink);
      border-radius: var(--radius-full);
      padding: 0 6px;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .terminal-body {
      flex: 1;
      padding: 6px 8px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      line-height: 1.55;
      overflow-y: auto;
      color: var(--text-secondary);
      background-image: radial-gradient(var(--dots) 1px, transparent 1px);
      background-size: 12px 12px;
    }
    .terminal-body::-webkit-scrollbar { width: 6px; }
    .terminal-body::-webkit-scrollbar-track { background: transparent; }
    .terminal-body::-webkit-scrollbar-thumb { background: var(--text-dim); border-radius: 3px; }

    .log-line {
      display: flex;
      align-items: baseline;
      gap: 6px;
      padding: 1.5px 3px;
      border-radius: 3px;
    }
    .log-line:hover { background: var(--surface-hover); }
    .log-ts { font-size: 9px; color: var(--text-muted); flex-shrink: 0; letter-spacing: -0.2px; }
    .log-prompt { color: var(--red); font-size: 9px; flex-shrink: 0; font-weight: 800; }
    .log-msg { flex: 1; word-break: break-all; color: var(--text-primary); }
    .log-msg.ok   { color: var(--ghost-mint); }
    .log-msg.err  { color: var(--ghost-rose); font-weight: 700; }
    .log-msg.info { color: var(--ghost-cyan); }

    .terminal-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 5px; color: var(--text-muted);
    }
    .terminal-empty-icon { font-size: 18px; opacity: 0.5; }
    .terminal-empty-text { font-size: 9.5px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.8px; }

    .bench-row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 3px; border-bottom: 1px dashed var(--hairline); }
    .bench-row span:last-child { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; }
    .bench-note { color: var(--text-muted); margin-top: 6px; }
    #bench-results { margin-top: 10px; }

    /* ── BUTTONS ── */
    .footer { display: flex; gap: 6px; flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px; padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 10.5px; font-weight: 800;
      font-family: var(--font-ui);
      white-space: nowrap;
    }
    .btn-icon { width: 30px; height: 30px; padding: 0; flex-shrink: 0; }
    .btn-primary { flex: 1; background: var(--yellow); }
    .btn-primary:hover { background: #ffc92a; }
    .btn-primary.indexing svg { animation: spin 1s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 45px;
      left: 50%;
      transform: translateX(-50%) translateY(15px);
      opacity: 0;
      pointer-events: none;
      background: var(--yellow);
      border: var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius-full);
      padding: 5px 12px;
      font-size: 10px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 100;
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(253, 241, 220, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--transition);
    }
    .modal-overlay.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .modal-card {
      box-shadow: 4px 4px 0 var(--ink);
      width: 100%;
      max-width: 290px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transform: scale(0.95);
      transition: transform var(--transition);
    }
    .modal-overlay.show .modal-card { transform: scale(1); }
    .modal-title-row { display: flex; align-items: center; justify-content: space-between; }
    .modal-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .modal-desc { font-size: 9.5px; color: var(--text-secondary); line-height: 1.4; }
    .modal-error { min-height: 14px; color: var(--ghost-rose); font-size: 10px; font-weight: 700; }
    .modal-input {
      width: 100%;
      background: var(--surface-base);
      border: var(--border);
      border-radius: var(--radius-xs);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 9.5px;
      padding: 6px 8px;
      outline: none;
    }
    .modal-input:focus { background: #fffbe8; box-shadow: var(--shadow-sm); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 6px; margin-top: 2px; }

    /* ── SETUP GUIDE OVERLAY (built in JS) ── */
    .setup-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 16px; gap: 10px;
      font-family: var(--font-ui);
    }
    .setup-logo {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--yellow); border: var(--border); box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
    }
    .setup-title { font-size: 14px; font-weight: 800; color: var(--ink); letter-spacing: -0.2px; }
    .setup-desc { font-size: 10px; color: var(--text-secondary); text-align: center; max-width: 240px; line-height: 1.5; }
    .setup-opt {
      width: 100%; background: var(--surface-card); border: var(--border); border-radius: var(--radius-md);
      box-shadow: var(--shadow); padding: 8px 11px; display: flex; flex-direction: column; gap: 3px;
    }
    .setup-opt.recommended { background: #fff6dc; }
    .setup-opt-label { font-size: 8px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase; color: var(--text-muted); font-family: var(--font-mono); }
    .setup-opt-cmd { font-family: var(--font-mono); font-size: 11.5px; font-weight: 700; color: var(--ink); user-select: text; }
    .setup-opt-note { font-size: 8.5px; color: var(--text-muted); }
    .setup-wait { display: flex; align-items: center; gap: 6px; font-size: 9px; color: var(--text-secondary); font-family: var(--font-mono); }
  </style>
</head>
<body>

  <div class="app">

    <!-- ── HEADER  ── -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 10h.01M15 10h.01M12 2a8 8 0 0 0-8 8v11l3-2 3 2 2-2 2 2 3-2 3 2V10a8 8 0 0 0-8-8z"/>
          </svg>
        </div>
        <div class="brand-info">
          <div class="brand-title-row">
            <span class="brand-name">Figma Rust MCP</span>
            <span class="brand-ver" id="runtime-version">v6.0.0</span>
          </div>
          <span class="brand-file" id="doc-display" title="Active Document">Ready</span>
        </div>
      </div>

      <div class="header-actions">
        <!-- Re-index Icon Button -->
        <button class="header-icon-btn" id="reindex-btn" onclick="triggerManualReindex()" title="Sync index" aria-label="Sync Figma canvas index">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </button>

        <!-- Reconnect / Probe Bridge Port Button -->
        <button class="header-icon-btn" id="reconnect-btn" onclick="reconnect()" title="Reconnect" aria-label="Reconnect to Figma Rust MCP">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
        </button>

        <!-- Copy File / Session Link -->
        <button class="header-icon-btn" id="file-link-btn" onclick="copyFileLink(event)" title="Set or copy Figma file link" aria-label="Set or copy Figma file link">

  <script>
  (function() {
    if (window.__disposeFigmaMcpUi) window.__disposeFigmaMcpUi();
    var uiDisposed = false;
    var uiEvents = new AbortController();
    var uiTimeouts = new Set(), uiIntervals = new Set();
    var rafId = null;
    function setTimeout(callback, delay) {
      if (uiDisposed) return;
      var id = window.setTimeout(function() { uiTimeouts.delete(id); if (!uiDisposed) callback(); }, delay);
      uiTimeouts.add(id);
      return id;
    }
    function clearTimeout(id) { uiTimeouts.delete(id); window.clearTimeout(id); }
    function setInterval(callback, delay) {
      if (uiDisposed) return;
      var id = window.setInterval(function() { if (!uiDisposed) callback(); }, delay);
      uiIntervals.add(id);
      return id;
    }
    function clearInterval(id) { uiIntervals.delete(id); window.clearInterval(id); }
    window.__disposeFigmaMcpUi = function() {
      if (uiDisposed) return;
      uiDisposed = true;
      polling = false;
      uiEvents.abort();
      uiTimeouts.forEach(function(id) { window.clearTimeout(id); });
      uiIntervals.forEach(function(id) { window.clearInterval(id); });
      uiTimeouts.clear(); uiIntervals.clear();
      if (rafId) cancelAnimationFrame(rafId);
      if (activeAbortController) activeAbortController.abort();
      if (ws) { ws.onopen = ws.onmessage = ws.onclose = ws.onerror = null; ws.close(); }
      window.onmessage = null;
      window.__onKeySaved = null;
    };
    var currentPort = window.__FIGMA_MCP_PORT || 41730; // set by the thin loader; 41730-41739 must match the server range
    var BRIDGE  = "http://localhost:" + currentPort;
    var POLL_MS = 300;
    var POLL_MAX_MS = 3000;
    var LONG_POLL_TIMEOUT = 12000;
    var SHORT_POLL_TIMEOUT = 3000;
    var consecutiveErrors = 0;
    var everConnected = false;
    var lastSuccessfulPollAt = Date.now();
    var sessionId = null;
    var fileName = null;
    var fileKey = null;
    var documentId = null;

    var writeCount = 0, readCount = 0, errCount = 0;
    var totalLogEvents = 0;
    var polling = true;
    var activeLogFilter = 'all';

    var logEl             = document.getElementById("log");
    var logEmptyEl        = document.getElementById("log-empty");
    var dotEl             = document.getElementById("dot");
    var statusEl          = document.getElementById("status-text");
    var statusPill        = document.getElementById("status-pill");
    var logCountEl        = document.getElementById("log-count");
    var docDispEl         = document.getElementById("doc-display");
    var speedEl           = document.getElementById("speed-display");
    var ramEl             = document.getElementById("ram-display");
    var reindexBtn        = document.getElementById("reindex-btn");
    var reindexBtnLabel   = document.getElementById("reindex-btn-label");
    var indexProgressWrap = document.getElementById("index-progress-wrap");
    var indexProgressText = document.getElementById("index-progress-text");

    var selCardEl         = document.getElementById("selection-card");
    var selIconEl         = document.getElementById("selection-icon");
    var selNameEl         = document.getElementById("selection-name");
    var selMetaEl         = document.getElementById("selection-meta");
    var selActionsEl      = document.getElementById("selection-actions");
    var selBadgeEl        = document.getElementById("selection-badge");
    var snapshotBtn       = document.getElementById("snapshot-btn");
    var toastEl           = document.getElementById("toast");
    var toastTextEl       = document.getElementById("toast-text");
    var toastIconEl       = document.getElementById("toast-icon");

    var currentSelectionCount = 0;
    var currentSelectionId = null;
    var currentSelectionMainId = null;
    var currentSelectionName = "";

    function showToast(msg, icon) {
      if (!toastEl) return;
      if (toastTextEl) toastTextEl.textContent = msg;
      if (toastIconEl) toastIconEl.textContent = icon || "✓";
      toastEl.classList.add("show");
      setTimeout(function() {
        toastEl.classList.remove("show");
      }, 2200);
    }

    function setLogFilter(filter, el) {
      activeLogFilter = filter;
      var tabs = document.querySelectorAll(".t-tab");
      tabs.forEach(function(t) { t.classList.remove("active"); });
      if (el) el.classList.add("active");

      var benchMode = filter === 'bench';
      document.getElementById("bench").style.display = benchMode ? "block" : "none";
      logEl.style.display = benchMode ? "none" : "";
      if (benchMode) return;

      var lines = logEl.querySelectorAll(".log-line");
      var visibleCount = 0;
      lines.forEach(function(line) {
        var match = false;
        if (filter === 'all') {
          match = true;
        } else if (filter === 'writes') {
          match = line.dataset.type === 'write';
        } else if (filter === 'reads') {
          match = line.dataset.type === 'read';
        } else if (filter === 'errors') {
          match = line.dataset.cls === 'err';
        }
        line.style.display = match ? "flex" : "none";
        if (match) visibleCount++;
      });

      if (logEmptyEl) {
        if (visibleCount === 0 && totalLogEvents > 0) {
          logEmptyEl.style.display = "flex";
          var emptyText = logEmptyEl.querySelector(".terminal-empty-text");
          if (emptyText) emptyText.textContent = filter === 'errors' ? "No errors logged" : "No matching logs";
        } else if (totalLogEvents === 0) {
          logEmptyEl.style.display = "flex";
          var emptyText = logEmptyEl.querySelector(".terminal-empty-text");
          if (emptyText) emptyText.textContent = "Listening on MCP bridge…";
        } else {
          logEmptyEl.style.display = "none";
        }
      }
    }

    async function fetchServerStats() {
      if (!everConnected) return;
      try {
        var res = await fetch(BRIDGE + "/health", { signal: AbortSignal.timeout(1000) });
        if (res.ok) {
          var data = await res.json();
          if (data && data.stats && ramEl) {
            ramEl.textContent = data.stats.memoryMb != null ? data.stats.memoryMb.toFixed(1) : "—";
          }
        }
      } catch(e) {}
    }

    function fmtLatency(s) {
      if (!s) return "skipped";
      var f = function(ms) { return ms < 1 ? (ms * 1000).toFixed(0) + "µs" : ms.toFixed(1) + "ms"; };
      return "p50 " + f(s.p50Ms) + " · p95 " + f(s.p95Ms) + " (n=" + s.n + ")";
    }

    async function runBenchmark() {
      var btn = document.getElementById("bench-run");
      var out = document.getElementById("bench-results");
      btn.disabled = true;
      btn.textContent = "Running…";
      try {
        var res = await fetch(BRIDGE + "/benchmark", { method: "POST", signal: AbortSignal.timeout(30000) });
        if (!res.ok) throw new Error("HTTP " + res.status + " (server older than v4.1?)");
        var r = await res.json();
        var rows = [
          ["Server", "v" + r.version],
          ["Startup (main → listening)", r.startupMs != null ? r.startupMs.toFixed(1) + "ms" : "—"],
          ["RAM (RSS)", r.memoryMb != null ? r.memoryMb.toFixed(1) + "MB" : "n/a on this OS"],
          ["MCP tools/list (in-process)", fmtLatency(r.mcpToolsList)],
          ["Index search" + (r.indexNodes != null ? " (" + r.indexNodes + " nodes)" : ""), r.indexNodes != null ? fmtLatency(r.indexSearch) : "no index yet"],
          ["Plugin round trip", fmtLatency(r.pluginRoundTrip)]
        ];
        out.innerHTML = "";
        rows.forEach(function(row) {
          var div = document.createElement("div");
          div.className = "bench-row";
          row.forEach(function(text) { var span = document.createElement("span"); span.textContent = text; div.appendChild(span); });
          out.appendChild(div);
        });
        var note = document.createElement("div");
        note.className = "bench-note";
        note.textContent = "Measured " + new Date().toLocaleTimeString() + " on this machine.";
        out.appendChild(note);
      } catch (e) {
        out.textContent = "Benchmark failed: " + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = "Run benchmark";
      }
    }
    setInterval(fetchServerStats, 4000);

    var activeIndexScan = null;
    var indexAckTimer = null;
    var indexHideTimer = null;

    function setIndexStatus(label, busy) {
      clearTimeout(indexHideTimer);
      indexProgressWrap.classList.add("active");
      indexProgressWrap.setAttribute("aria-busy", String(busy));
      indexProgressText.textContent = label;
      reindexBtn.classList.toggle("indexing", busy);
      reindexBtn.disabled = busy;
    }

    function failIndexSync(error) {
      clearTimeout(indexAckTimer);
      activeIndexScan = null;
      setIndexStatus("Sync failed: " + error + " Click Sync to retry.", false);
      log("Index sync: " + error, "err");
    }

    function receiveIndexAck(msg) {
      if (!activeIndexScan || msg.scanId !== activeIndexScan.scanId || msg.pageId !== activeIndexScan.pageId) return;
      clearTimeout(indexAckTimer);
      if (!msg.success) { failIndexSync(msg.error || "Bridge rejected index"); return; }
      activeIndexScan = null;
      setIndexStatus("Index synced", false);
      reindexBtn.title = "Sync index · Last synced " + new Date().toLocaleString();
      log("Index confirmed by bridge", "ok", "read");
      indexHideTimer = setTimeout(function() { indexProgressWrap.classList.remove("active"); }, 1200);
    }

    function handleIndexMessage(msg) {
      if (["index-start", "index-progress", "index-chunk", "index-update", "index-error", "index-abort"].indexOf(msg.type) < 0) return false;
      if (!msg.silent && (msg.type === "index-start" || (msg.type === "index-progress" && msg.stage === "starting"))) {
        clearTimeout(indexAckTimer);
        activeIndexScan = { scanId: msg.scanId, pageId: msg.pageId };
        setIndexStatus("Reading layers…", true);
      }
      var current = !msg.silent && activeIndexScan && msg.scanId === activeIndexScan.scanId && msg.pageId === activeIndexScan.pageId;
      if (msg.type === "index-progress") {
        if (current && msg.stage !== "done") setIndexStatus(msg.label || "Reading layers…", true);
        return true;
      }
      if (msg.type === "index-error" || msg.type === "index-abort") {
        if (current || (!msg.silent && !msg.scanId)) failIndexSync(msg.error || "Index cancelled");
      }
      if (msg.type !== "index-error") {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          if (current) failIndexSync("Bridge disconnected");
          return true;
        }
        if (current && msg.type === "index-update") {
          setIndexStatus("Waiting for bridge confirmation…", true);
          indexAckTimer = setTimeout(function() {
            failIndexSync("No bridge confirmation received; check the server connection and version");
          }, 30000);
        }
        try { ws.send(JSON.stringify(msg)); }
        catch (error) { if (current) failIndexSync(error.message); }
      }
      return true;
    }

    function triggerManualReindex() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        failIndexSync("Bridge disconnected");
        log("Cannot index: Server is offline", "err");
        showSetupGuide();
        return;
      }
      activeIndexScan = { scanId: null, pageId: null };
      setIndexStatus("Waiting for canvas…", true);
      clearTimeout(indexAckTimer);
      indexAckTimer = setTimeout(function() { failIndexSync("Canvas did not start indexing"); }, 30000);
      log("⚡ Manual re-index triggered…", "info");
      parent.postMessage({ pluginMessage: { type: "manual-reindex" } }, "*");
    }

    function focusSelection() {
      if (currentSelectionCount > 0) {
        parent.postMessage({ pluginMessage: { type: "zoom-to-selection" } }, "*");
      }
    }

    function exportSelectionImage(event) {
      if (event) event.stopPropagation();
      if (currentSelectionCount === 0) return;
      if (snapshotBtn) snapshotBtn.disabled = true;
      parent.postMessage({ pluginMessage: { type: "export-selection-image", scale: 2 } }, "*");
    }

    function copyTextFallback(text) {
      try {
        var textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        textarea.style.top = "-9999px";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        var successful = document.execCommand("copy");
        document.body.removeChild(textarea);
        return successful;
      } catch (err) {
        return false;
      }
    }

    function openKeyModal(onSuccess) {
      var modal = document.getElementById("key-modal-overlay");
      var input = document.getElementById("file-key-input");
      if (modal && input) {
        keyModalOpener = document.activeElement;
        input.value = fileKey ? ("https://www.figma.com/design/" + fileKey) : "";
        document.getElementById("file-key-error").textContent = "";
        modal.setAttribute("aria-hidden", "false");
        modal.classList.add("show");
        window.__onKeySaved = onSuccess;
        setTimeout(function() { input.focus(); input.select(); }, 50);
      }
    }

    var keyModalOpener = null;
    function closeKeyModal() {
      var modal = document.getElementById("key-modal-overlay");
      if (modal) {
        modal.classList.remove("show");
        modal.setAttribute("aria-hidden", "true");
      }
      window.__onKeySaved = null;
      if (keyModalOpener && keyModalOpener.focus) keyModalOpener.focus();
      keyModalOpener = null;
    }

    function parseFigmaFileKey(value) {
      var trimmed = value.trim();
      var match = trimmed.match(/^https?:\/\/(?:www\.)?figma\.com\/(?:file|design)\/([a-zA-Z0-9_-]+)(?:\/|\?|#|$)/i);
      var key = match ? match[1] : trimmed;
      return /^[a-zA-Z0-9_-]{8,}$/.test(key) ? key : null;
    }

    function saveFileKeyFromModal() {
      var input = document.getElementById("file-key-input");
      var val = input ? input.value.trim() : "";
      var parsedKey = parseFigmaFileKey(val);
      if (!parsedKey) {
        document.getElementById("file-key-error").textContent = "Enter a valid Figma file URL or file key.";
        if (input) input.focus();
        return;
      }
      fileKey = parsedKey;
      parent.postMessage({ pluginMessage: { type: "set-file-key", fileKey: parsedKey } }, "*");
      var cb = window.__onKeySaved;
      closeKeyModal();
      if (typeof cb === "function") {
        cb(fileKey);
      } else {
        copyTextToClipboard("https://www.figma.com/design/" + fileKey, "File link copied");
      }
    }

    document.getElementById("file-key-input").addEventListener("input", function() {
      document.getElementById("file-key-error").textContent = "";
    }, { signal: uiEvents.signal });
    document.addEventListener("keydown", function(event) {
      var modal = document.getElementById("key-modal-overlay");
      if (!modal.classList.contains("show")) return;
      if (event.key === "Escape") {
        closeKeyModal();
      } else if (event.key === "Tab") {
        var controls = modal.querySelectorAll("button:not([disabled]), input:not([disabled])");
        var first = controls[0], last = controls[controls.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    }, { signal: uiEvents.signal });

    function copyFileLink(event) {
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      openKeyModal(function(savedKey) {
        if (savedKey) {
          copyTextToClipboard("https://www.figma.com/design/" + savedKey, "File link copied");

    function copySelectionLink(event) {

        event.stopPropagation();
        event.preventDefault();

        showToast("No selection active", "⚠️");

        return;

    function executeCopyLink(effectiveKey) {
      if (!currentSelectionId) return;
      
      var targetId = currentSelectionMainId || currentSelectionId;
      var figmaNodeId = targetId.replace(/:/g, "-");
      
      // Figma web link uses a sanitized slug of the file name (or untitled)
      var cleanSlug = (fileName || "file")
        .replace(/[\[\]\(\)\{\}]/g, "")
        .trim()
        .replace(/\s+/g, "-");
      var encodedSlug = encodeURIComponent(cleanSlug);
      
      var link = "";
      if (effectiveKey) {
        link = "https://www.figma.com/design/" + effectiveKey + "/" + encodedSlug + "?node-id=" + figmaNodeId;
      } else {
        link = "https://www.figma.com/design/draft/" + encodedSlug + "?node-id=" + figmaNodeId;
      }
      
      copyTextToClipboard(link, "Link copied");
    }

    function copySelectionId(event) {
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      if (!currentSelectionId) return;
      var copied = copyTextFallback(currentSelectionId);
      if (!copied && navigator && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(currentSelectionId).then(function() {
          showToast("Node ID: " + currentSelectionId + " copied", "📋");
          try {
            parent.postMessage({ pluginMessage: { type: "notify", message: "📋 Node ID: " + currentSelectionId + " copied" } }, "*");
          } catch(e) {}
        }).catch(function() {
          prompt("Copy Node ID:", currentSelectionId);
        });
      } else if (copied) {
        showToast("Node ID: " + currentSelectionId + " copied", "📋");
        try {
          parent.postMessage({ pluginMessage: { type: "notify", message: "📋 Node ID: " + currentSelectionId + " copied" } }, "*");
        } catch(e) {}
      } else {
        prompt("Copy Node ID:", currentSelectionId);
      }
    }

    var READ_OPS = [
      "get_selection","get_design","get_page_nodes","screenshot",
      "get_styles","get_local_components","get_viewport","get_variables",
      "export_svg","get_node_detail","export_image","search_nodes","scan_design",
      "index_scan"
    ];

    function setStatus(state, text) {
      dotEl.className = "dot " + (state === "green" ? "green" : (state === "yellow" ? "yellow" : "red"));
      if (state === "green") text += " :" + currentPort;
      statusEl.textContent = text;

      statusPill.className = "status-pill";
      statusPill.setAttribute("aria-label", "Connection status: " + text + ". Click for details");
      if (state === "green")  statusPill.classList.add("connected");
      if (state === "red")    statusPill.classList.add("offline");
      if (state === "yellow") statusPill.classList.add("connecting");
    }

    function handleStatusClick() {
      if (!wsConnected) {
        showSetupGuide();
      } else {
        showToast("Bridge active on port " + currentPort, "⚡");
      }
    }

    function showSetupGuide() {
      var existing = document.getElementById("setup-overlay");
      if (existing) { existing.remove(); return; }

      var overlay = document.createElement("div");
      overlay.id = "setup-overlay";
      overlay.className = "setup-overlay";

      overlay.innerHTML = [
        '<div class="setup-logo">',
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
        '</div>',
        '<div class="setup-title">Start Figma Rust MCP Server</div>',
        '<div class="setup-desc">Run command in your project terminal:</div>',

        '<div class="setup-opt">',
          '<div class="setup-opt-label">Option A · Run once</div>',

        '<div class="setup-opt recommended">',
          '<div class="setup-opt-label">Option B · Auto-start ✦ Recommended</div>',

          '<div class="setup-opt-note">Background service for Claude / IDE</div>',

      ].join("");

      document.body.appendChild(overlay);

      var checks = 0;
      var checker = setInterval(function() {

        fetch(BRIDGE + "/health", { cache: "no-store", signal: AbortSignal.timeout(400) })
          .then(function(res) {
            if (res.ok) {
              clearInterval(checker);
              var ov = document.getElementById("setup-overlay");
              if (ov) ov.remove();
              log("✓ Server detected — connecting…", "ok");
              reconnect();
            }
          })
          .catch(function() {
            if (checks >= 60) clearInterval(checker);
          });
      }, 500);
    }

    var totalErrors = 0;

    function updateErrorBadge() {
      var badge = document.getElementById("tab-err-badge");
      if (!badge) return;
      if (totalErrors > 0) {
        badge.textContent = totalErrors;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    }

    async function copyTextToClipboard(text, successMsg) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          showToast(successMsg || "Copied!", "✓");
          return true;
        } catch(e) {}
      }
      if (fallbackCopy(text)) {
        showToast(successMsg || "Copied!", "✓");
        return true;
      }
      showToast("Copy failed", "✗");
      return false;
    }

    function fallbackCopy(text) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        var copied = document.execCommand("copy");
        document.body.removeChild(ta);
        return copied;
      } catch(e) { return false; }
    }

    function copyLogs() {
      var lines = logEl.querySelectorAll(".log-line");
      var visibleTexts = [];
      lines.forEach(function(line) {
        if (line.style.display !== "none") {
          var ts = line.querySelector(".log-ts");
          var msg = line.querySelector(".log-msg");
          var text = (ts ? ts.textContent + " " : "") + (msg ? msg.textContent : line.textContent);
          visibleTexts.push(text.trim());
        }
      });

      if (visibleTexts.length === 0) {
        showToast(activeLogFilter === 'errors' ? "No errors to copy" : "No logs to copy", "ℹ");
        return;
      }

      var fullText = visibleTexts.join("\n");
      var label = activeLogFilter === 'errors' ? "Errors copied (" + visibleTexts.length + ")!" : "Logs copied (" + visibleTexts.length + ")!";
      copyTextToClipboard(fullText, label);
    }

    function log(msg, cls, opType) {
      totalLogEvents++;
      if (cls === 'err') {
        totalErrors++;
        updateErrorBadge();
      }
      if (logCountEl) logCountEl.textContent = totalLogEvents + " ev";

      if (logEmptyEl) logEmptyEl.style.display = "none";

      var wasNearBottom = (logEl.scrollHeight - logEl.clientHeight - logEl.scrollTop) <= 45;

      var line = document.createElement("div");
      line.className = "log-line";
      if (opType) line.dataset.type = opType;
      if (cls) line.dataset.cls = cls;
      line.title = "Click to copy";
      line.style.cursor = "pointer";

      var ts = document.createElement("span");
      ts.className = "log-ts";
      ts.textContent = new Date().toLocaleTimeString("en", { hour12: false });

      var prompt = document.createElement("span");
      prompt.className = "log-prompt";
      prompt.textContent = "❯";

      var content = document.createElement("span");
      content.className = "log-msg" + (cls ? " " + cls : "");
      content.textContent = msg;

      line.appendChild(ts);
      line.appendChild(prompt);
      line.appendChild(content);

      line.addEventListener("click", function() {
        var text = (ts ? ts.textContent + " " : "") + (content ? content.textContent : line.textContent);
        copyTextToClipboard(text.trim(), "Copied line!");
      }, { signal: uiEvents.signal });

      if (activeLogFilter === 'writes' && opType !== 'write') {
        line.style.display = "none";
      } else if (activeLogFilter === 'reads' && opType !== 'read') {
        line.style.display = "none";
      } else if (activeLogFilter === 'errors' && cls !== 'err') {
        line.style.display = "none";
      }

      logEl.appendChild(line);

      if (wasNearBottom) {
        logEl.scrollTop = logEl.scrollHeight;
      }

      if (logEl.children.length > 90) {
        var keep = Array.from(logEl.children).slice(-70);
        logEl.replaceChildren.apply(logEl, keep);
      }
    }

    function clearLog() {
      logEl.innerHTML = "";
      totalLogEvents = 0;
      totalErrors = 0;
      updateErrorBadge();
      if (logCountEl) logCountEl.textContent = "0 ev";
      var empty = document.createElement("div");
      empty.id = "log-empty";
      empty.className = "terminal-empty";
      empty.innerHTML = '<div class="terminal-empty-icon">◌</div><div class="terminal-empty-text">Listening on MCP bridge…</div>';
      logEl.appendChild(empty);
      logEmptyEl = empty;
    }

    function sleep(ms) {
      return new Promise(function(r) { setTimeout(r, ms); });
    }

    function getBackoff() {
      return Math.min(POLL_MS * Math.pow(2, Math.min(consecutiveErrors - 1, 3)), POLL_MAX_MS);
    }

    var ws = null;
    var wsConnected = false;
    var isLongPolling = false;
    var activeAbortController = null;
    var isFirstPoll = true;
    var retryTimer = null;

    async function initConnection() {
      if (uiDisposed || wsConnected) return;

      try {
        var res = await fetch("http://localhost:" + currentPort + "/health", { signal: AbortSignal.timeout(600) });
        if (uiDisposed) return;
        if (res.ok) {
          BRIDGE = "http://localhost:" + currentPort;
          everConnected = true;
          consecutiveErrors = 0;
          lastSuccessfulPollAt = Date.now();
          setStatus("yellow", "Server found · connecting…");
          connectWs();
          return;
        }
      } catch(e) {}

      var scanPorts = [];
      for (var sp = 41730; sp < 41740; sp++) if (sp !== currentPort) scanPorts.push(sp);
      try {
        var winner = await Promise.any(scanPorts.map(function(p) {
          return fetch("http://localhost:" + p + "/health", { signal: AbortSignal.timeout(500) })
            .then(function(r) { if (!r.ok) throw new Error("not ok"); return p; });
        }));
        if (uiDisposed) return;
        currentPort = winner;
        window.__FIGMA_MCP_PORT = winner;
        BRIDGE = "http://localhost:" + winner;
        everConnected = true;
        consecutiveErrors = 0;
        lastSuccessfulPollAt = Date.now();
        setStatus("yellow", "Server found · connecting…");
        connectWs();
        return;
      } catch(_) {}

      setStatus("yellow", "Waiting…");
      if (retryTimer) clearTimeout(retryTimer);
      retryTimer = setTimeout(function() {
        if (!wsConnected && polling) {
          initConnection();
        }
      }, 1500);
    }

    function updateRuntimeVersion(version) {
      var badge = document.getElementById("runtime-version");
      if (badge && typeof version === "string" && version.length) {
        badge.textContent = "v" + version;
        badge.title = "Connected server v" + version;
      }
    }
    var runtimeCapabilities = null;
    function sendRuntimeCapabilities() {
      if (runtimeCapabilities && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(runtimeCapabilities));
      }
    }
    function connectWs() {
      if (uiDisposed || !sessionId) return; // Wait for runtime identity; never share _default.
      if (ws) {
        if (activeIndexScan) failIndexSync("Bridge reconnecting");
        try { ws.close(); } catch(e) {}
        ws = null;
      }

      var wsHost = BRIDGE.replace(/^http:\/\//, "ws://");
      var wsUrl = wsHost + "/ws";
      var qs = [];
      if (sessionId) qs.push("sessionId=" + encodeURIComponent(sessionId));
      if (fileName) qs.push("fileName=" + encodeURIComponent(fileName));
      if (documentId) qs.push("documentId=" + encodeURIComponent(documentId));
      if (qs.length) wsUrl += "?" + qs.join("&");

      try {
        ws = new WebSocket(wsUrl);
      } catch (err) {
        startLongPoll();
        return;
      }

      var socket = ws;
      var pingTimer = null;

      ws.onopen = function() {
        if (ws !== socket) return;
        wsConnected = true;
        sendRuntimeCapabilities();
        consecutiveErrors = 0;
        everConnected = true;
        if (retryTimer) clearTimeout(retryTimer);
        lastSuccessfulPollAt = Date.now();
        setStatus("green", "Live");
        log("Connected to Figma Rust MCP · port " + currentPort, "ok");

        if (pingTimer) clearInterval(pingTimer);
        pingTimer = setInterval(function() {
          if (ws === socket && socket.readyState === WebSocket.OPEN) {
            try { socket.send(JSON.stringify({ type: "ping" })); } catch(e) {}
          } else {
            clearInterval(pingTimer);
          }
        }, 15000);
      };

      ws.onmessage = function(event) {
        if (ws !== socket) return;
        try {
          var req = JSON.parse(event.data);
          if (req && req.type === "index-ack") {
            receiveIndexAck(req);
            return;
          }
          if (req && req.type === "index-resync") {
            dispatchToMain({ type: "index-resync" });
            return;
          }
          if (req && req.type === "server-hello") {
            if (Array.isArray(req.activeTaskIds)) dispatchToMain({ type: "task-sync", taskIds: req.activeTaskIds });
            var serverVer = req.version;
            updateRuntimeVersion(serverVer);
            if (!window.__FIGMA_RUST_MCP_VER) {
              window.__FIGMA_RUST_MCP_VER = serverVer;
              window.__FIGMA_RUST_MCP_RUNTIME_HASH = req.runtimeHash;
            } else if (window.__FIGMA_RUST_MCP_VER !== serverVer || (req.runtimeHash && window.__FIGMA_RUST_MCP_RUNTIME_HASH && req.runtimeHash !== window.__FIGMA_RUST_MCP_RUNTIME_HASH)) {
              // window survives document.write, so record what we reload into;
              // otherwise every later server-hello reloads again, forever.
              window.__FIGMA_RUST_MCP_VER = serverVer;
              window.__FIGMA_RUST_MCP_RUNTIME_HASH = req.runtimeHash;
              log("⚡ Server updated to v" + serverVer + " — Hot reloading in 500ms…", "info");
              setTimeout(function() {
                triggerHotReload(currentPort);
              }, 500);
              return;
            }
          }

          if (req && req.type === "server-reload") {
            log("⚡ Hot reloading requested by server…", "info");
            triggerHotReload(currentPort);
            return;
          }

          if (req && req.operation) {
            var isRead = READ_OPS.indexOf(req.operation) >= 0;
            log("→ " + req.operation, isRead ? "info" : "ok", isRead ? "read" : "write");
            try { ws.send(JSON.stringify({ type: "ack", id: req.id })); } catch(e) {}
            dispatchToMain(req);
          }
        } catch (e) {
          log("WS parse error: " + e.message, "err");
        }
      };

      async function triggerHotReload(port) {
        try {
          var codeRes = await fetch("http://localhost:" + port + "/plugin/code.js?t=" + Date.now());
          if (codeRes.ok) {
            var codeText = await codeRes.text();
            parent.postMessage({ pluginMessage: { type: "EVAL_MAIN_CODE", code: codeText } }, "*");
          }
          var uiRes = await fetch("http://localhost:" + port + "/plugin/ui.html?t=" + Date.now());
          if (uiRes.ok) {
            var uiHtml = await uiRes.text();
            window.__FIGMA_MCP_PORT = port;
            window.__disposeFigmaMcpUi();
            document.open();
            document.write(uiHtml);
            document.close();
          }
        } catch (err) {
          console.error("[figma-rust-mcp hot-reload error]", err);
        }
      }

      ws.onerror = function() {
        if (ws !== socket) return;
        setStatus("yellow", everConnected ? "Reconnecting…" : "Connecting…");
      };

      ws.onclose = function() {
        if (pingTimer) clearInterval(pingTimer);
        if (ws !== socket) return;
        wsConnected = false;
        if (activeIndexScan) failIndexSync("Bridge disconnected");
        setStatus("yellow", "Reconnecting…");
        if (polling) {
          startLongPoll();
          if (retryTimer) clearTimeout(retryTimer);
          retryTimer = setTimeout(function() {
            if (!wsConnected && polling) initConnection();
          }, 2000);
        }
      };
    }

    async function startLongPoll() {
      if (uiDisposed || !sessionId || isLongPolling || wsConnected) return;
      isLongPolling = true;

      try {
        while (sessionId && polling && !wsConnected) {
          var receivedThisRound = 0;
          try {
            var pollSid = sessionId;
            var pollUrl = BRIDGE + "/poll";
            var qs = [];
            if (sessionId) qs.push("sessionId=" + encodeURIComponent(sessionId));
            if (fileName) qs.push("fileName=" + encodeURIComponent(fileName));
      if (documentId) qs.push("documentId=" + encodeURIComponent(documentId));
            if (isFirstPoll) {
              qs.push("init=true");
              isFirstPoll = false;
            }
            if (qs.length) pollUrl += "?" + qs.join("&");

            var fetchTimeout = consecutiveErrors > 0 ? SHORT_POLL_TIMEOUT : LONG_POLL_TIMEOUT;
            var ctrl = new AbortController();
            activeAbortController = ctrl;
            var timeoutId = setTimeout(function() { ctrl.abort(); }, fetchTimeout);
            var res;
            try {
              res = await fetch(pollUrl, { signal: ctrl.signal });
            } finally {
              clearTimeout(timeoutId);
              if (activeAbortController === ctrl) {
                activeAbortController = null;
              }
            }

            if (!res.ok) {
              setStatus("yellow", "Busy");
              consecutiveErrors++;
              await sleep(getBackoff());
              continue;
            }

            var body = await res.json();
            if (pollSid !== sessionId || (body.sessionId && body.sessionId !== pollSid)) continue;
            var reqs = body.requests || [];
            receivedThisRound = reqs.length;
            setStatus("green", reqs.length ? reqs.length + " cmd" : "Live");

            consecutiveErrors = 0;
            everConnected = true;
            lastSuccessfulPollAt = Date.now();

            for (var i = 0; i < reqs.length; i++) {
              var req = reqs[i];
              var isRead = READ_OPS.indexOf(req.operation) >= 0;
              log("→ " + req.operation, isRead ? "info" : "ok", isRead ? "read" : "write");
              dispatchToMain(req);
            }
          } catch (e) {
            if (!polling) break;
            consecutiveErrors++;
            var backoff = getBackoff();
            if (consecutiveErrors <= 5) {
              setStatus("yellow", "Connecting (" + consecutiveErrors + ")");
            } else if (consecutiveErrors <= 10) {
              setStatus("yellow", "Retrying…");
            } else {
              setStatus("red", "Offline");
            }
            await sleep(backoff);
            continue;
          }
          if (!receivedThisRound) await sleep(POLL_MS);
        }
      } finally {
        isLongPolling = false;
      }
    }

    function buildResponseBody(id, success, dataJson, error) {
      return '{"id":' + JSON.stringify(id) +
        ',"success":' + (success ? "true" : "false") +
        ',"data":' + (dataJson === undefined || dataJson === null ? "null" : dataJson) +
        ',"error":' + (error === undefined || error === null ? "null" : JSON.stringify(String(error))) +
        '}';
    }

    async function sendResponse(id, success, dataJson, error, responseSessionId) {
      var body = buildResponseBody(id, success, dataJson, error);
      body = body.slice(0, -1) + ",\"sessionId\":" + JSON.stringify(responseSessionId || sessionId) + "}";

      if ((!responseSessionId || responseSessionId === sessionId) && ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(body);
          return;
        } catch(e) {}
      }

      try {
        var res = await fetch(BRIDGE + "/response", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: body
        });
        if (!res.ok) log("Response rejected: HTTP " + res.status, "err");
      } catch (e) {
        log("Response failed: " + e.message, "err");
      }
    }

    function dispatchToMain(req) {
      parent.postMessage({ pluginMessage: req }, "*");
    }

    function reconnect() {
      if (uiDisposed) return;
      polling = false;
      wsConnected = false;
      isFirstPoll = true;
      consecutiveErrors = 0;
      setStatus("yellow", "Reconnecting…");
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }
      if (activeAbortController) {
        try { activeAbortController.abort(); } catch(e) {}
      }
      setTimeout(function() {
        polling = true;
        initConnection();
      }, 100);
    }

    function sendActivePing() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        try {
          ws.send(JSON.stringify({ type: "ping", active: true, sessionId: sessionId, fileName: fileName }));
        } catch(e) {}
      }
    }

    window.addEventListener("focus", sendActivePing, { signal: uiEvents.signal });
    document.addEventListener("pointerdown", sendActivePing, { signal: uiEvents.signal });

    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState !== "visible") return;
      sendActivePing();
      if (!everConnected) return;
      var idleMs = Date.now() - lastSuccessfulPollAt;
      if (!wsConnected || consecutiveErrors > 0 || activeAbortController || idleMs > 20000) {
        log("Focus sync (" + Math.round(idleMs / 1000) + "s)", "info");
        reconnect();
      }
    }, { signal: uiEvents.signal });

    function getIconForType(type) {
      if (!type) return '<rect x="3" y="3" width="18" height="18" rx="2"/>';
      var t = type.toUpperCase();
      if (t === "FRAME" || t === "SECTION") {
        return '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>';
      }
      if (t === "COMPONENT" || t === "INSTANCE") {
        return '<path d="M12 2L2 12l10 10 10-10L12 2z"/>';
      }
      if (t === "TEXT") {
        return '<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/>';
      }
      if (t === "GROUP") {
        return '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>';
      }
      return '<rect x="3" y="3" width="18" height="18" rx="2"/>';
    }

    function renderSelection(msg) {
      if (!selCardEl || !selNameEl || !selMetaEl || !selBadgeEl || !selIconEl) return;

      var count = msg.count || 0;
      var list = msg.selection || [];
      currentSelectionCount = count;
      currentSelectionId = (count === 1 && list[0]) ? list[0].id : null;
      currentSelectionMainId = (count === 1 && list[0]) ? (list[0].mainId || list[0].id) : null;
      currentSelectionName = (count === 1 && list[0]) ? (list[0].name || "Layer") : "";

      if (count === 0) {
        selCardEl.classList.remove("has-selection");
        selIconEl.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>';
        selNameEl.textContent = "No selection";
        selMetaEl.textContent = msg.pageName ? "Page: " + msg.pageName : (fileName || "Canvas root");
        if (selActionsEl) selActionsEl.style.display = "none";
        selCardEl.title = "No layer selected in Figma canvas";
      } else if (count === 1) {
        var node = list[0];
        selCardEl.classList.add("has-selection");
        selIconEl.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + getIconForType(node.type) + '</svg>';
        selNameEl.textContent = node.name || "Untitled Node";

        var metaParts = [];
        if (node.width && node.height) metaParts.push(node.width + " × " + node.height);
        if (msg.pageName) metaParts.push(msg.pageName);
        selMetaEl.textContent = metaParts.length ? metaParts.join(" · ") : (node.type || "Layer");

        selBadgeEl.textContent = node.type || "NODE";
        if (selActionsEl) selActionsEl.style.display = "flex";
        selCardEl.title = "Click to center view on: " + (node.name || "Node") + " (" + (node.type || "NODE") + " ID: " + node.id + ")";
      } else {
        selCardEl.classList.add("has-selection");
        selIconEl.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>';
        var names = list.slice(0, 2).map(function(n) { return n.name; }).join(", ");
        selNameEl.textContent = count + " layers selected";
        selMetaEl.textContent = names + (count > 2 ? " +" + (count - 2) + " more" : "");
        selBadgeEl.textContent = count + " ITEMS";
        if (selActionsEl) selActionsEl.style.display = "flex";
        selCardEl.title = "Click to center view on " + count + " selected layers";
      }
    }

    window.onmessage = async function(event) {
      var msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "session-info") {
        runtimeCapabilities = { type: "runtime-capabilities", runtimeVersion: msg.runtimeVersion,
          protocolVersion: msg.protocolVersion, operations: msg.operations, documentId: msg.documentId };
        sendRuntimeCapabilities();
        var prevSid = sessionId;
        sessionId = msg.sessionId || null;
        fileName = msg.fileName || null;
        fileKey = msg.fileKey || null;
        documentId = msg.documentId || null;
        if (fileName && docDispEl) {
          docDispEl.textContent = fileName;
          docDispEl.title = fileName + " (" + (sessionId || "active session") + ")";
        }
        if (sessionId) log("Linked: " + (fileName || sessionId), "info");
        if (sessionId && sessionId !== prevSid) {
          reconnect();
        }
        return;
      }

      if (msg.type === "selection-change") {
        renderSelection(msg);
        if (ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(JSON.stringify({
              type: "selection-change",
              sessionId: sessionId,
              count: msg.count,
              pageName: msg.pageName,
              selection: msg.selection,
              fullNode: msg.fullNode
            }));
          } catch(e) {}
        }
        sendActivePing();
        return;
      }

      if (msg.type === "node-patch" || msg.type === "nodes-invalidated") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify(msg)); } catch(e) {}
        }
        return;
      }

      if (msg.type === "delta-diff") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try {
            ws.send(JSON.stringify({
              type: "delta-diff",
              sessionId: sessionId,
              id: msg.id,
              diff: msg.diff
            }));
          } catch(e) {}
        }
        return;
      }

      if (msg.type === "selection-image-exported") {
        if (snapshotBtn) snapshotBtn.disabled = false;
        if (msg.error) {
          showToast("Export failed: " + msg.error, "✗");
          return;
        }
        if (msg.bytes && msg.bytes.length > 0) {
          try {
            var blob = new Blob([new Uint8Array(msg.bytes)], { type: "image/png" });
            if (navigator && navigator.clipboard && navigator.clipboard.write) {
              await navigator.clipboard.write([
                new ClipboardItem({ "image/png": blob })
              ]);
              showToast("PNG Copied to Clipboard (2x)", "📸");
              log("📸 Exported PNG for " + (msg.nodeName || "node"), "ok", "read");
            } else {
              showToast("Image captured", "📸");
            }
          } catch(err) {
            showToast("Failed to copy image", "✗");
          }
        }
        return;
      }

      if (msg.type === "node-diff") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({ type: "node-diff", nodes: msg.nodes, deletedIds: msg.deletedIds })); } catch(e) {}
        }
        return;
      }

      if (handleIndexMessage(msg)) return;

      if (msg.type === "document-change") {
        if (ws && ws.readyState === WebSocket.OPEN) {
          try { ws.send(JSON.stringify({ type: "document-change", changedNodeIds: msg.changedNodeIds })); } catch(e) {}
        }
        return;
      }

      var isRead = READ_OPS.indexOf(msg.operation) >= 0;
      var durationStr = msg.durationMs !== undefined ? " (" + msg.durationMs + "ms)" : "";
      if (msg.durationMs !== undefined && speedEl) {
        speedEl.textContent = msg.durationMs;
      }
      if (msg.success) {
        if (isRead) {
          readCount++;
          document.getElementById("read-count").textContent = readCount;
        } else {
          writeCount++;
          document.getElementById("write-count").textContent = writeCount;
        }
        log("✓ " + (msg.id ? msg.id.slice(-6) : "ok") + durationStr, "ok", isRead ? "read" : "write");
      } else {
        errCount++;
        log("✗ " + (msg.id ? msg.id.slice(-6) : "err") + durationStr + ": " + (msg.error || "fail"), "err", isRead ? "read" : "write");
      }
      var payloadJson = msg.dataJson !== undefined
        ? msg.dataJson
        : (msg.data !== undefined ? JSON.stringify(msg.data) : null);
      await sendResponse(msg.id, msg.success, payloadJson, msg.error, msg.sessionId);
    };

    initConnection();

    // Smooth Drag Resize (60FPS via requestAnimationFrame)
    (function initResize() {
      var grip = document.getElementById("resize-grip");
      if (!grip) return;

      var lastW = 0, lastH = 0;

      grip.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        grip.setPointerCapture(e.pointerId);
        var startX = e.clientX;
        var startY = e.clientY;
        var startW = window.innerWidth;
        var startH = window.innerHeight;

        function onPointerMove(ev) {
          var nw = Math.max(280, Math.min(1000, Math.round(startW + (ev.clientX - startX))));
          var nh = Math.max(220, Math.min(1200, Math.round(startH + (ev.clientY - startY))));
          lastW = nw;
          lastH = nh;

          if (!rafId) {
            rafId = requestAnimationFrame(function() {
              parent.postMessage({ pluginMessage: { type: "resize", width: lastW, height: lastH } }, "*");
              rafId = null;
            });
          }
        }

        function onPointerUp(ev) {
          try { grip.releasePointerCapture(ev.pointerId); } catch(err) {}
          window.removeEventListener("pointermove", onPointerMove);
          window.removeEventListener("pointerup", onPointerUp);
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          if (lastW > 0 && lastH > 0) {
            parent.postMessage({ pluginMessage: { type: "resize", width: lastW, height: lastH } }, "*");
            parent.postMessage({ pluginMessage: { type: "save-window-size", width: lastW, height: lastH } }, "*");
          }
        }

        window.addEventListener("pointermove", onPointerMove, { signal: uiEvents.signal });
        window.addEventListener("pointerup", onPointerUp, { signal: uiEvents.signal });
      }, { signal: uiEvents.signal });
    })();
    Object.assign(window, { clearLog, closeKeyModal, copyFileLink, copyLogs, copySelectionId, copySelectionLink, exportSelectionImage, focusSelection, handleStatusClick, reconnect, runBenchmark, saveFileKeyFromModal, setLogFilter, triggerManualReindex });
    parent.postMessage({ pluginMessage: { type: "runtime-ready" } }, "*");
  })();
  </script>
</body>
