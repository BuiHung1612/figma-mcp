name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Build Figma Plugin
        run: node scripts/build-plugin.js

      - name: Test plugin token extraction and version
        run: node --test scripts/test-plugin-tokens.mjs scripts/test-bench.mjs

      - name: Rust regression tests
        run: cargo test

      - name: Cargo Check
        run: cargo check --verbose

      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build Release Binary
        run: cargo build --release

      - name: Test bridge sessions and index sync
        run: node --test scripts/test-bridge-sessions.mjs
        env:
          FIGMA_TEST_BINARY: target/release/figma-rust-mcp

      - name: Test MCP JSON-RPC
        run: ./scripts/test-rust-mcp.sh
