name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: figma-mcp-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/figma-mcp
            compress_cmd: tar -czf figma-mcp-linux-x86_64.tar.gz -C target/x86_64-unknown-linux-gnu/release figma-mcp
            asset_name: figma-mcp-linux-x86_64.tar.gz

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: figma-mcp-linux-arm64
            binary_path: target/aarch64-unknown-linux-gnu/release/figma-mcp
            compress_cmd: tar -czf figma-mcp-linux-arm64.tar.gz -C target/aarch64-unknown-linux-gnu/release figma-mcp
            asset_name: figma-mcp-linux-arm64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: figma-mcp-macos-arm64
            binary_path: target/aarch64-apple-darwin/release/figma-mcp
            compress_cmd: tar -czf figma-mcp-macos-arm64.tar.gz -C target/aarch64-apple-darwin/release figma-mcp
            asset_name: figma-mcp-macos-arm64.tar.gz

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: figma-mcp-macos-x86_64
            binary_path: target/x86_64-apple-darwin/release/figma-mcp
            compress_cmd: tar -czf figma-mcp-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release figma-mcp
            asset_name: figma-mcp-macos-x86_64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: figma-mcp-windows-x86_64
            binary_path: target/x86_64-pc-windows-msvc/release/figma-mcp.exe
            compress_cmd: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/figma-mcp.exe -DestinationPath figma-mcp-windows-x86_64.zip
            asset_name: figma-mcp-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build target binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: ${{ matrix.compress_cmd }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.compress_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  publish-release:
    name: Create GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Plugin Bundle
        run: node scripts/build-plugin.js

      - name: Zip Figma Plugin
        run: |
          cd plugin && zip -r ../plugin.zip manifest.json code.js ui.html *.png && cd ..

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
            SHA256SUMS.txt
            plugin.zip
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to NPM (if NPM_TOKEN configured)
        if: env.NPM_TOKEN != ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public || echo "npm publish skipped or already published"
